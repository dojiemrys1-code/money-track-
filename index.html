  const seeAll = (href, label) => `<a class="link" href="${href}">${esc(label || t('common.seeAll'))} ${ic('fwd', 'flip sm')}</a>`;
  const empty = (text, cta) => `<div class="empty">${ic('info')}<p>${esc(text)}</p>${cta || ''}</div>`;
  const bar = pct => `<div class="progress" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
  const notice = (n, est) => (n ? `<div class="notice warn">${ic('warn')}<span>${t('conv.partial', { n })}</span></div>` : '') +
    (est && !n ? `<div class="notice">${ic('info')}<span>${t('conv.estimated')}</span></div>` : '');
  const sheetHead = (title) => `<div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-action="close-sheet" aria-label="${t('common.close')}">${ic('close')}</button></div>`;
  const field = (label, inner, hint) => `<label class="field"><span>${esc(label)}</span>${inner}${hint ? `<small>${hint}</small>` : ''}</label>`;
  const inp = (name, val, attrs) => `<input name="${name}" value="${esc(val)}" ${attrs || ''}>`;
  const sel = (name, opts, val, attrs) => `<select name="${name}" ${attrs || ''}>${opts.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(val) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  const curOpts = () => C.CURRENCIES.map(c => ({ v: c.code, l: `${c.code} — ${c.symbol}` }));
  const goalOpts = () => [{ v: '', l: t('sv.noGoal') }].concat(S().goals.map(g => ({ v: g.id, l: g.name })));
  /* Si tout est exclu faute de taux, afficher « — » plutôt qu'un faux zéro. */
  const fig = (v, ex, c) => (ex > 0 && Math.abs(v) < 1e-9 ? '—' : fmt(v, c));
  const num = v => (v == null || v === '' ? '' : String(v));

  /* ---------- transactions ---------- */
  function txRow(tx) {
    const sh = MT.currency.show(tx.amount, tx.currency);
    const acc = F().account(tx.accountId);
    const main = tx.desc ? esc(tx.desc) : t('cat.' + tx.category);
    const sub = (tx.desc ? t('cat.' + tx.category) + ' · ' : '') + dateFmt(tx.date) + (acc ? ' · ' + esc(F().accountName(acc)) : '');
    return `<button class="row" data-action="sheet" data-sheet="tx" data-id="${tx.id}">
      <span class="tile ${tx.type}">${CAT[tx.category] || '•'}</span>
      <span class="grow"><b>${main}</b><small>${sub}</small></span>
      <span class="amt ${tx.type}">${tx.type === 'income' ? '+' : '−'}${sh.text}${sh.sub ? `<small>${esc(sh.sub)}</small>` : ''}${sh.ok ? '' : `<small class="warn-t">${t('conv.unavailableShort')}</small>`}</span></button>`;
  }
  const recent = n => S().transactions.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, n);

  /* ---------- accueil ---------- */
  V.home = function () {
    const st = S(), bal = F().balance(), m = F().flowsThisMonth(), sv = F().savingsTotal();
    const unread = MT.notify.unread();
    const series = F().series(6);
    const goals = st.goals.slice(0, 3);
    const actives = st.strategies.filter(s => s.active).length;
    const excl = bal.excluded + m.excluded + sv.excluded;
    const est = bal.estimated || m.estimated || sv.estimated;
    const quick = [
      ['income', 'up', t('quick.income')], ['expense', 'down', t('quick.expense')], ['#savings', 'repeat', t('quick.savings')],
      ['#ai', 'sparkle', t('quick.ai')], ['#goals', 'target', t('quick.goals')], ['#budgets', 'percent', t('quick.budgets')]
    ].map(q => q[0].startsWith('#')
      ? `<a class="quick" href="${q[0]}">${ic(q[1])}<span>${q[2]}</span></a>`
      : `<button class="quick ${q[0]}" data-action="sheet" data-sheet="tx" data-type="${q[0]}">${ic(q[1])}<span>${q[2]}</span></button>`).join('');
    return `${header(t('home.hello', { name: esc(st.session.name || '') }), { right:
      `<button class="icon-btn" data-action="sheet" data-sheet="notifs" aria-label="${t('notif.title')}">${ic('bell')}${unread ? `<i class="badge">${unread}</i>` : ''}</button>` })}
      ${notice(excl, est)}
      ${V.insights()}${V.checklist()}
      <section class="hero">
        <div class="hero-top"><span>${t('home.totalBalance')}</span><span class="code">${disp()}</span>
          <button class="icon-btn ghost" data-action="toggle-hide" aria-label="${t('priv.hide')}">${ic('eye')}</button></div>
        <div class="hero-amt">${fig(bal.value, bal.excluded)}</div>
        <div class="hero-row">
          <div><small>${ic('up', 'sm')} ${t('home.monthIncome')}</small><b class="pos">${fig(m.income, m.excluded)}</b></div>
          <div><small>${ic('down', 'sm')} ${t('home.monthExpense')}</small><b class="neg">${fig(m.expense, m.excluded)}</b></div>
        </div>
      </section>
      <div class="quick-grid">${quick}</div>
      ${card(`<div class="split"><div><small>${t('home.totalSavings')}</small><b class="big">${fig(sv.total, sv.excluded)}</b></div>
        <a class="btn soft" href="#savings">${ic('repeat')} ${t('home.smartSavings')}</a></div>
        <p class="muted sm">${actives ? t('home.activeRules', { n: actives }) : t('home.noRules')}</p>`)}
      ${card(`${sectionHead(t('home.chartTitle'), seeAll('#stats', t('nav.stats')))}
        ${MT.charts.bars(series, { income: t('tx.income'), expense: t('tx.expense') })}
        <div class="legend"><span><i class="dot inc"></i>${t('tx.income')}</span><span><i class="dot exp"></i>${t('tx.expense')}</span></div>`)}
      ${sectionHead(t('home.goals'), seeAll('#goals'))}
      ${goals.length ? `<div class="hscroll">${goals.map(goalCard).join('')}</div>` : empty(t('goal.empty'), `<button class="btn soft" data-action="sheet" data-sheet="goal">${t('goal.add')}</button>`)}
      ${sectionHead(t('home.recent'), seeAll('#history'))}
      ${card(recent(5).map(txRow).join('') || empty(t('tx.empty')), 'list')}`;
  };

  /* ---------- objectifs ---------- */
  function goalCard(g) {
    const saved = F().goalSaved(g), pct = F().goalPct(g);
    const sh = MT.currency.show(saved, g.currency), tg = MT.currency.show(g.target, g.currency);
    return `<a class="goal-card" href="#goal-${g.id}"><b>${esc(g.name)}</b>
      <span class="muted sm">${sh.text} / ${tg.text}</span>${bar(pct)}
      <span class="goal-foot"><em>${Math.round(pct)}%</em>${g.deadline ? `<small>${dateFmt(g.deadline, { month: 'short', year: 'numeric' })}</small>` : ''}</span></a>`;
  }

  V.goals = function () {
    const gs = S().goals;
    return `${header(t('goal.title'), { back: true, right: `<button class="icon-btn accent" data-action="sheet" data-sheet="goal" aria-label="${t('goal.add')}">${ic('plus')}</button>` })}
      ${gs.length ? `<div class="stack">${gs.map(goalCard).join('')}</div>` : empty(t('goal.empty'), `<button class="btn primary" data-action="sheet" data-sheet="goal">${t('goal.add')}</button>`)}`;
  };

  V.goal = function (id) {
    const g = S().goals.find(x => x.id === id);
    if (!g) return header(t('goal.title'), { back: true }) + empty(t('goal.notFound'));
    const saved = F().goalSaved(g), pct = F().goalPct(g), remain = Math.max(0, g.target - saved);
    const sh = MT.currency.show(saved, g.currency), tg = MT.currency.show(g.target, g.currency), rm = MT.currency.show(remain, g.currency);
    let plan = '';
    if (pct >= 100) plan = `<p class="pos">${ic('check', 'sm')} ${t('goal.reached')}</p>`;
    else if (g.deadline) {
      const days = Math.ceil((new Date(g.deadline + 'T00:00:00') - new Date(U.today() + 'T00:00:00')) / 86400000);
      if (days < 0) plan = `<p class="neg">${t('goal.overdue')}</p>`;
      else {
        const months = Math.max(1, Math.ceil(days / 30));
        plan = `<p class="muted">${t('goal.daysLeft', { n: days })} · ${t('goal.perMonth', { a: MT.currency.show(remain / months, g.currency).text })}</p>`;
      }
    }
    const contribs = F().goalContribs(g.id);
    const rows = contribs.map(e => {
      const s = MT.currency.show(e.amount, e.currency);
      return `<div class="row static"><span class="tile income">${ic('repeat')}</span><span class="grow"><b>${e.source === 'withdraw' ? t('goal.withdrawn') : e.source === 'manual' ? t('goal.manual') : t('sv.type.' + e.source)}</b><small>${dateFmt(e.date)}</small></span><span class="amt ${e.amount < 0 ? 'expense' : 'income'}">${e.amount < 0 ? '−' : '+'}${MT.currency.show(Math.abs(e.amount), e.currency).text}</span></div>`;
    }).join('');
    return `${header(g.name, { back: true, right: `<button class="icon-btn" data-action="sheet" data-sheet="goal" data-id="${g.id}" aria-label="${t('common.edit')}">${ic('edit')}</button>` })}
      ${card(`<div class="center"><div class="ring-pct">${Math.round(pct)}%</div></div>${bar(pct)}
        <div class="split3"><div><small>${t('goal.saved')}</small><b>${sh.text}</b></div><div><small>${t('goal.target')}</small><b>${tg.text}</b></div><div><small>${t('goal.remaining')}</small><b>${rm.text}</b></div></div>${plan}${V.goalForecast(g)}
        <div class="two"><button class="btn primary" data-action="sheet" data-sheet="contribute" data-id="${g.id}">${ic('plus')} ${t('goal.contribute')}</button>
        <button class="btn soft" data-action="sheet" data-sheet="withdraw" data-id="${g.id}">${ic('minus')} ${t('goal.withdraw')}</button></div>`)}
      ${sectionHead(t('goal.history'))}
      ${card(rows || empty(t('goal.noContrib')), 'list')}`;
  };

  /* ---------- portefeuille ---------- */
  V.wallet = function () {
    const st = S(), bal = F().balance(), m = F().flowsThisMonth();
    const accs = st.accounts.map(a => {
      const b = F().balance(null, a.id);
      return `<button class="row" data-action="sheet" data-sheet="acct" data-id="${a.id}"><span class="tile acc">${ic(ACC_IC[a.type] || 'wallet')}</span><span class="grow"><b>${esc(F().accountName(a))}</b>
        <small>${a.type === 'mobile' ? t('wallet.simulated') : t('acct.' + a.type)} · ${a.currency}</small></span><span class="amt">${b.excluded ? '—' : fmt(b.value)}</span></button>`;
    }).join('');
    const prov = MT.services.payments.providers.map(p => `<div class="row static dim"><span class="tile acc">${ic('phone')}</span><span class="grow"><b>${p.name}</b><small>${t('wallet.notIntegrated')}</small></span><span class="chip">${t('wallet.soon')}</span></div>`).join('');
    return `${header(t('nav.wallet'))}
      ${notice(bal.excluded + m.excluded, bal.estimated || m.estimated)}
      <section class="hero"><div class="hero-top"><span>${t('wallet.available')}</span><span class="code">${disp()}</span></div>
        <div class="hero-amt">${fig(bal.value, bal.excluded)}</div>
        <div class="hero-row"><div><small>${ic('up', 'sm')} ${t('wallet.in')}</small><b class="pos">${fig(m.income, m.excluded)}</b></div>
        <div><small>${ic('down', 'sm')} ${t('wallet.out')}</small><b class="neg">${fig(m.expense + m.saved, m.excluded)}</b></div></div></section>
      <div class="two"><button class="btn primary" data-action="sheet" data-sheet="tx" data-type="income">${ic('up')} ${t('quick.income')}</button>
        <button class="btn soft" data-action="sheet" data-sheet="tx" data-type="expense">${ic('down')} ${t('quick.expense')}</button></div>
      <div class="notice">${ic('info')}<span>${t('wallet.simNote')}</span></div>
      ${sectionHead(t('wallet.accounts'), `<button class="link" data-action="sheet" data-sheet="acct">+ ${t('acct.add')}</button>`)}${card(accs, 'list')}${V.walletMore()}
      ${sectionHead(t('wallet.integrations'))}${card(prov, 'list')}
      ${sectionHead(t('home.recent'), seeAll('#history'))}${card(recent(8).map(txRow).join('') || empty(t('tx.empty')), 'list')}`;
  };

  /* ---------- historique ---------- */
  function historyList() {
    const f = ui.hist, q = f.q.trim().toLowerCase();
    const items = S().transactions.filter(x => (f.type === 'all' || x.type === f.type) && (!f.cat || x.category === f.cat) &&
      (!q || (x.desc || '').toLowerCase().includes(q) || t('cat.' + x.category).toLowerCase().includes(q)))
      .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    if (!items.length) return empty(t('tx.empty'));
    let out = '', cur = '';
    items.forEach(x => {
      const k = U.monthKey(x.date);
      if (k !== cur) { cur = k; out += `<div class="group-label">${esc(monthName(k))}</div>`; }
      out += txRow(x);
    });
    return `<div class="card list">${out}</div>`;
  }
  V.historyList = historyList;
  V.history = function () {
    const f = ui.hist;
    const cats = C.CATEGORIES.income.concat(C.CATEGORIES.expense).map(c => ({ v: c, l: t('cat.' + c) }));
    return `${header(t('hist.title'), { back: true })}
      <div class="filters"><input class="search" data-input="search" placeholder="${t('hist.search')}" value="${esc(f.q)}" type="search">
        <div class="seg">${['all', 'income', 'expense'].map(k => `<button class="${f.type === k ? 'on' : ''}" data-action="hist-type" data-v="${k}">${t(k === 'all' ? 'hist.all' : 'tx.' + k)}</button>`).join('')}</div>
        ${sel('cat', [{ v: '', l: t('hist.allCats') }].concat(cats), f.cat, 'data-change="hist-cat"')}</div>
      <div id="hist-list">${historyList()}</div>`;
  };

  /* ---------- statistiques ---------- */
  V.stats = function () {
    const cur = U.monthKey(U.today());
    if (!ui.statMonth) ui.statMonth = cur;
    const key = ui.statMonth, series = F().series(ui.range);
    const m = F().monthTotals(key), cats = F().categoryBreakdown(key);
    const total = cats.reduce((a, c) => a + c.value, 0);
    const prevKey = U.addMonths(key, -1), prev = F().monthTotals(prevKey);
    const rate = m.income > 0 ? Math.round(m.saved / m.income * 100) : 0;
    const delta = (a, b) => (b ? Math.round((a - b) / b * 100) : null);
    const dTxt = d => (d == null ? '—' : (d > 0 ? '+' : '') + d + '%');
    const sav = series.map(s => ({ label: MT.charts.monthLabel(s.key), v: s.cumSaved }));
    const excl = series.reduce((a, s) => a + (s.excluded || 0), 0);
    const rows = series.slice().reverse().map((s, i, arr) => {
      const p = arr[i + 1];
      return `<tr><td>${esc(MT.charts.monthLabel(s.key, { month: 'short', year: '2-digit' }))}</td><td class="pos">${fmt(s.income)}</td><td class="neg">${fmt(s.expense)}</td>
        <td class="${s.net >= 0 ? 'pos' : 'neg'}">${fmt(s.net)}</td><td class="muted">${p ? dTxt(delta(s.expense, p.expense)) : '—'}</td></tr>`;
    }).join('');
    return `${header(t('nav.stats'))}
      ${notice(excl, m.estimated)}
      ${V.health()}
      <div class="seg wide">${[3, 6, 12].map(n => `<button class="${ui.range === n ? 'on' : ''}" data-action="set-range" data-v="${n}">${t('stats.months', { n })}</button>`).join('')}</div>
      ${card(`${sectionHead(t('stats.incomeExpense'))}${MT.charts.bars(series, { income: t('tx.income'), expense: t('tx.expense') })}
        <div class="legend"><span><i class="dot inc"></i>${t('tx.income')}</span><span><i class="dot exp"></i>${t('tx.expense')}</span></div>`)}
      <div class="month-nav"><button class="icon-btn" data-action="stat-month" data-v="-1" aria-label="${t('stats.prev')}">${ic('back', 'flip')}</button>
        <b>${esc(monthName(key))}</b>
        <button class="icon-btn" data-action="stat-month" data-v="1" ${key >= cur ? 'disabled' : ''} aria-label="${t('stats.next')}">${ic('fwd', 'flip')}</button></div>
      ${card(`${sectionHead(t('stats.byCategory'))}${cats.length ? `<div class="donut-wrap">${MT.charts.donut(cats.map(c => ({ label: t('cat.' + c.category), value: c.value })), fmt(total), t('tx.expense'))}
        <ul class="cat-list">${cats.map((c, i) => `<li><i style="background:${MT.charts.PALETTE[i % MT.charts.PALETTE.length]}"></i><span>${t('cat.' + c.category)}</span><b>${Math.round(c.value / total * 100)}%</b><small>${fmt(c.value)}</small></li>`).join('')}</ul></div>` : empty(t('stats.noData'))}`)}
      ${card(`${sectionHead(t('stats.summary'))}<div class="grid2">
        <div><small>${t('tx.income')}</small><b class="pos">${fmt(m.income)}</b><em>${dTxt(delta(m.income, prev.income))}</em></div>
        <div><small>${t('tx.expense')}</small><b class="neg">${fmt(m.expense)}</b><em>${dTxt(delta(m.expense, prev.expense))}</em></div>
        <div><small>${t('stats.net')}</small><b class="${m.net >= 0 ? 'pos' : 'neg'}">${fmt(m.net)}</b></div>
        <div><small>${t('stats.saved')}</small><b>${fmt(m.saved)}</b><em>${t('stats.rate', { p: rate })}</em></div></div>
        ${cats[0] ? `<p class="muted sm">${t('stats.topCat', { c: t('cat.' + cats[0].category) })}</p>` : ''}
        <p class="muted sm">${t('stats.vsPrev', { m: esc(monthName(prevKey)) })}</p>
        <button class="btn soft sm" data-action="copy-summary">${ic('download', 'sm')} ${t('stats.copy')}</button>`)}
      ${card(`${sectionHead(t('stats.savingsEvo'))}${MT.charts.line(sav)}`)}
      ${card(`${sectionHead(t('stats.compare'))}<div class="table-wrap"><table><thead><tr><th>${t('stats.month')}</th><th>${t('tx.income')}</th><th>${t('tx.expense')}</th><th>${t('stats.net')}</th><th>Δ</th></tr></thead><tbody>${rows}</tbody></table></div>`)}`;
  };

  /* ---------- épargne ---------- */
  function describe(s) {
    const f = v => fmt(v, s.currency);
    if (s.type === 'threshold') return t('sv.desc.threshold', { th: f(s.threshold), a: f(s.amount) });
    if (s.type === 'percent') return t('sv.desc.percent', { p: s.percent });
    if (s.type === 'monthly') return t('sv.desc.monthly', { a: f(s.amount), d: s.day });
    return t('sv.desc.perIncome', { a: f(s.amount) });
  }
  const SV_IC = { threshold: 'bolt', percent: 'percent', monthly: 'calendar', perIncome: 'repeat' };

  V.savings = function () {
    const st = S(), sv = F().savingsTotal();
    const res = st.savingsSettings;
    const cards = st.strategies.map(s => {
      const stt = MT.savings.stats(s.id), g = st.goals.find(x => x.id === s.goalId);
      return `<div class="card strat ${s.active ? '' : 'paused'}"><div class="strat-top"><span class="tile acc">${ic(SV_IC[s.type])}</span>
        <div class="grow"><b>${t('sv.type.' + s.type)}</b><small>${describe(s)}</small></div>
        <span class="chip ${s.active ? 'on' : ''}">${s.active ? t('sv.active') : t('sv.paused')}</span></div>
        ${g ? `<small class="muted">${ic('target', 'sm')} ${esc(g.name)}</small>` : ''}
        ${s.type === 'monthly' ? `<small class="muted">${t('sv.done', { n: stt.done })} · ${t('sv.missed', { n: stt.missed })}</small>` : ''}
        <div class="strat-actions"><button class="btn soft sm" data-action="toggle-strategy" data-id="${s.id}">${ic(s.active ? 'pause' : 'play', 'sm')} ${s.active ? t('sv.pause') : t('sv.resume')}</button>
          <button class="btn soft sm" data-action="sheet" data-sheet="strategy" data-id="${s.id}">${ic('edit', 'sm')} ${t('common.edit')}</button>
          <button class="btn danger sm" data-action="sheet" data-sheet="confirm" data-kind="strategy" data-id="${s.id}">${ic('trash', 'sm')}</button></div></div>`;
    }).join('');
    const hist = st.ledger.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 15).map(e => {
      const missed = e.status === 'missed', sh = MT.currency.show(missed ? e.planned : e.amount, e.currency);
      const g = st.goals.find(x => x.id === e.goalId);
      return `<div class="row static"><span class="tile ${missed ? 'expense' : 'income'}">${ic(missed ? 'close' : 'check')}</span>
        <span class="grow"><b>${e.strategyId ? t('sv.type.' + e.source) : (e.source === 'withdraw' ? t('goal.withdrawn') : t('goal.manual'))}${missed ? ' · ' + t('sv.missedTag') : ''}</b><small>${dateFmt(e.date)}${g ? ' · ' + esc(g.name) : ''}</small></span>
        <span class="amt ${missed || e.amount < 0 ? 'neg' : 'income'}">${missed || e.amount < 0 ? '' : '+'}${sh.text}</span></div>`;
    }).join('');
    const add = MT.savings.TYPES.map(k => `<button class="add-strat" data-action="sheet" data-sheet="strategy" data-type="${k}">${ic(SV_IC[k])}<b>${t('sv.type.' + k)}</b><small>${t('sv.hint.' + k)}</small></button>`).join('');
    return `${header(t('sv.title'), { back: true })}
      <div class="notice warn">${ic('info')}<span>${t('sv.simNote')}</span></div>
      ${card(`<div class="split"><div><small>${t('home.totalSavings')}</small><b class="big">${fmt(sv.total)}</b></div>
        <a class="btn soft" href="#ai">${ic('sparkle')} ${t('quick.ai')}</a></div>
        <div class="row static flat"><span class="grow"><b>${t('sv.reserve')}</b><small>${t('sv.reserveHint')}</small></span>
          <button class="btn soft sm" data-action="sheet" data-sheet="reserve">${fmt(res.reserve, res.currency)} ${ic('edit', 'sm')}</button></div>`)}
      ${st.strategies.length ? sectionHead(t('sv.myRules')) + `<div class="stack">${cards}</div>` : ''}
      ${sectionHead(t('sv.addRule'))}<div class="add-grid">${add}</div>
      <p class="muted sm center">${t('sv.noDouble')}</p>
      ${sectionHead(t('sv.history'))}${card(hist || empty(t('sv.noHistory')), 'list')}`;
  };

  /* ---------- IA ---------- */
  V.ai = function () {
    const a = MT.ai.analyze();
    const head = header(t('ai.title'), { back: true });
    if (!a.ready) return head + empty(t('ai.noData'), `<button class="btn primary" data-action="sheet" data-sheet="tx" data-type="income">${t('quick.income')}</button>`);
    const recs = a.recs.map(r => {
      let title, why, actions;
      if (r.kind === 'monthly') {
        title = t('ai.monthly.title', { a: fmt(r.amount), d: r.day });
        why = t('ai.monthly.why', { inc: fmt(a.avgIncome), exp: fmt(a.avgExpense), sur: fmt(a.surplus), n: a.months });
      } else if (r.kind === 'percent') {
        title = t('ai.percent.title', { p: r.pct }); why = t('ai.percent.why', { p: r.pct, inc: fmt(a.avgIncome) });
      } else if (r.kind === 'adjust') {
        title = t('ai.adjust.title', { c: t('cat.' + r.category), a: fmt(r.cut) });
        why = t('ai.adjust.why', { c: t('cat.' + r.category), avg: fmt(r.avg) });
      } else if (r.kind === 'anomaly') {
        title = t('ai.anomaly.title', { c: t('cat.' + r.category), a: fmt(r.value) });
        why = t('ai.anomaly.why', { avg: fmt(r.avg) });
      } else { title = t('ai.deficit.title', { a: fmt(r.gap) }); why = t('ai.deficit.why'); }
      actions = r.strategy
        ? `<button class="btn primary sm" data-action="ai-accept" data-id="${esc(r.id)}">${ic('check', 'sm')} ${t('ai.accept')}</button>
           <button class="btn soft sm" data-action="ai-modify" data-id="${esc(r.id)}">${ic('edit', 'sm')} ${t('ai.modify')}</button>
           <button class="btn soft sm" data-action="ai-dismiss" data-id="${esc(r.id)}">${t('ai.refuse')}</button>`
        : `<button class="btn soft sm" data-action="ai-dismiss" data-id="${esc(r.id)}">${t('ai.gotIt')}</button>`;
      return `<div class="card rec ${r.kind}"><b>${title}</b><p class="muted">${why}</p><div class="strat-actions">${actions}</div></div>`;
    }).join('');
    const rec = a.recurring.map(r => `<div class="row static"><span class="tile expense">${CAT[r.category] || '•'}</span><span class="grow"><b>${esc(r.desc || t('cat.' + r.category))}</b><small>${t('ai.months', { n: r.months })}</small></span><span class="amt">${fmt(r.amount)}</span></div>`).join('');
    return `${head}
      <div class="notice">${ic('info')}<span>${t('ai.disclaimer')}</span></div>
      ${card(`<div class="grid2">
        <div><small>${t('ai.avgIncome')}</small><b class="pos">${fmt(a.avgIncome)}</b></div>
        <div><small>${t('ai.avgExpense')}</small><b class="neg">${fmt(a.avgExpense)}</b></div>
        <div><small>${t('ai.budget')}</small><b>${fmt(a.budget)}</b></div>
        <div><small>${t('ai.suggested')}</small><b class="accent-t">${a.suggested > 0 ? fmt(a.suggested) : '—'}</b></div></div>
        <p class="muted sm">${t('ai.basis', { n: a.months })}</p>`)}
      ${sectionHead(t('ai.recs'))}${recs ? `<div class="stack">${recs}</div>` : empty(t('ai.noRecs'))}
      ${sectionHead(t('ai.recurring'))}${card(rec || empty(t('ai.noRecurring')), 'list')}`;
  };

  /* ---------- profil ---------- */
  V.profile = function () {
    const st = S(), s = st.settings, lang = C.LANGUAGES.find(l => l.code === s.lang);
    const row = (icon, label, value, action) => `<button class="row" ${action}><span class="tile acc">${ic(icon)}</span><span class="grow"><b>${label}</b></span><span class="muted">${value || ''}</span>${ic('fwd', 'flip sm muted')}</button>`;
    const initials = (st.session.name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    return `${header(t('nav.profile'))}
      ${card(`<div class="profile-top"><div class="avatar">${esc(initials)}</div><div class="grow"><b>${esc(st.session.name)}</b><small class="muted">${esc(st.session.email)}</small></div>
        <button class="icon-btn" data-action="sheet" data-sheet="account" aria-label="${t('common.edit')}">${ic('edit')}</button></div>`)}
      ${sectionHead(t('prof.preferences'))}
      ${card(row('globe', t('prof.language'), lang.name, 'data-action="sheet" data-sheet="lang"') +
        row('coin', t('prof.currency'), s.currency, 'data-action="sheet" data-sheet="currency"') +
        row('palette', t('prof.theme'), t('theme.' + s.theme), 'data-action="sheet" data-sheet="theme"') +
        row('convert', t('prof.converter'), '', 'data-action="sheet" data-sheet="convert"') +
        row('bell', t('prof.notifications'), '', 'data-action="sheet" data-sheet="notifSettings"') +
        row('lock', t('prof.privacy'), '', 'data-action="sheet" data-sheet="privacy"'), 'list')}
      ${V.profileFinance()}${sectionHead(t('prof.data'))}
      ${card(row('download', t('prof.backup'), '', 'data-action="sheet" data-sheet="data"') +
        row('trash', t('prof.clear'), '', 'data-action="sheet" data-sheet="confirm" data-kind="clear"'), 'list')}
      <button class="btn danger block" data-action="logout">${ic('logout')} ${t('prof.logout')}</button>
      <p class="muted sm center">MoneyTrack Africa · v1.0 · ${t('prof.simOnly')}</p>`;
  };

  V.screen = function (r) {
    switch (r.name) {
      case 'wallet': return V.wallet();
      case 'stats': return V.stats();
      case 'profile': return V.profile();
      case 'savings': return V.savings();
      case 'goals': return V.goals();
      case 'goal': return V.goal(r.id);
      case 'history': return V.history();
      case 'ai': return V.ai();
      default: return V.home();
    }
  };

  V.nav = function (r) {
    const parent = { savings: 'home', goals: 'home', goal: 'home', ai: 'home', history: 'wallet', budgets: 'stats', recurring: 'wallet' }[r.name] || r.name;
    return [['home', 'home', 'nav.home'], ['wallet', 'wallet', 'nav.wallet'], ['stats', 'chart', 'nav.stats'], ['profile', 'user', 'nav.profile']]
      .map(n => `<a href="#${n[0]}" class="${parent === n[0] ? 'on' : ''}" ${parent === n[0] ? 'aria-current="page"' : ''}>${ic(n[1])}<span>${t(n[2])}</span></a>`).join('');
  };

  /* ---------- feuilles (modales) ---------- */
  const wrap = (inner) => `<div class="sheet-backdrop" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  const catOpts = type => C.CATEGORIES[type].map(c => ({ v: c, l: CAT[c] + ' ' + t('cat.' + c) }));

  V.catOptions = type => catOpts(type).map(o => `<option value="${o.v}">${esc(o.l)}</option>`).join('');

  V.sheet = function (name, d) {
    const st = S(), s = st.settings;
    switch (name) {
      case 'tx': {
        const tx = d.id ? st.transactions.find(x => x.id === d.id) : null;
        const type = tx ? tx.type : (d.type || 'expense');
        const accounts = st.accounts.map(a => ({ v: a.id, l: F().accountName(a) }));
        const defCur = tx ? tx.currency : s.currency;
        return wrap(`${sheetHead(tx ? t('tx.edit') : t('tx.add'))}
          <form data-form="tx" data-id="${tx ? tx.id : ''}">
            <div class="seg wide">${['income', 'expense'].map(k => `<label class="${type === k ? 'on' : ''}"><input type="radio" name="type" value="${k}" ${type === k ? 'checked' : ''} data-change="txtype">${t('tx.' + k)}</label>`).join('')}</div>
            <div class="two">${field(t('tx.amount'), inp('amount', tx ? tx.amount : '', 'inputmode="decimal" required placeholder="0" autofocus'))}
              ${field(t('tx.currency'), sel('currency', curOpts(), defCur))}</div>
            ${field(t('tx.category'), sel('category', catOpts(type), tx ? tx.category : ''))}
            ${field(t('tx.description'), inp('desc', tx ? tx.desc : '', 'maxlength="80"'))}
            <div class="two">${field(t('tx.date'), inp('date', tx ? tx.date : U.today(), 'type="date" required'))}
              ${field(t('tx.account'), sel('accountId', accounts, tx ? tx.accountId : (st.savingsSettings.accountId || accounts[0].v)))}</div>
            <small class="muted">${t('tx.currencyHint')}</small>
            <div class="form-actions">${tx ? `<button type="button" class="btn danger" data-action="sheet" data-sheet="confirm" data-kind="tx" data-id="${tx.id}">${ic('trash')}</button>` : ''}
              <button class="btn primary grow" type="submit">${t('common.save')}</button></div></form>`);
      }
      case 'goal': {
        const g = d.id ? st.goals.find(x => x.id === d.id) : null;
        return wrap(`${sheetHead(g ? t('goal.edit') : t('goal.add'))}<form data-form="goal" data-id="${g ? g.id : ''}">
          ${field(t('goal.name'), inp('name', g ? g.name : '', 'required maxlength="40"'))}
          <div class="two">${field(t('goal.target'), inp('target', g ? g.target : '', 'inputmode="decimal" required'))}
            ${field(t('tx.currency'), sel('currency', curOpts(), g ? g.currency : s.currency))}</div>
          ${field(t('goal.initial'), inp('initial', g ? g.initial : '0', 'inputmode="decimal"'))}
          ${field(t('goal.deadline'), inp('deadline', g ? g.deadline : '', 'type="date"'))}
          <div class="form-actions">${g ? `<button type="button" class="btn danger" data-action="sheet" data-sheet="confirm" data-kind="goal" data-id="${g.id}">${ic('trash')}</button>` : ''}
            <button class="btn primary grow" type="submit">${t('common.save')}</button></div></form>`);
      }
      case 'contribute': {
        const g = st.goals.find(x => x.id === d.id); if (!g) return '';
        const bal = F().balance();
        return wrap(`${sheetHead(t('goal.contribute'))}<form data-form="contribute" data-id="${g.id}">
          <p class="muted">${esc(g.name)} · ${t('wallet.available')} : <b>${fmt(bal.value)}</b></p>
          <div class="two">${field(t('tx.amount'), inp('amount', '', 'inputmode="decimal" required autofocus'))}${field(t('tx.currency'), sel('currency', curOpts(), s.currency))}</div>
          <div class="notice">${ic('info')}<span>${t('sv.simNote')}</span></div>
          <button class="btn primary block" type="submit">${t('common.confirm')}</button></form>`);
      }
      case 'strategy': {
        const ex = d.id ? st.strategies.find(x => x.id === d.id) : null;
        const type = ex ? ex.type : d.type;
        const base = ex || Object.assign({ goalId: '' }, MT.savings.defaults(type), d.prefill || {});
        const reserve = st.savingsSettings;
        let fields = '';
        const amountF = (n, v) => field(t('sv.f.' + n), inp(n, num(v), 'inputmode="decimal" required'));
        if (type === 'threshold') fields = amountF('threshold', base.threshold) + amountF('amount', base.amount) + field(t('sv.reserve'), inp('reserve', num(ex ? reserve.reserve : (base.reserve != null ? base.reserve : reserve.reserve)), 'inputmode="decimal" required'), t('sv.reserveHint'));
        if (type === 'percent') fields = `<div class="chips">${[5, 10, 15, 20].map(p => `<button type="button" class="chip ${Number(base.percent) === p ? 'on' : ''}" data-action="pick-percent" data-v="${p}">${p}%</button>`).join('')}</div>` +
          field(t('sv.f.percent'), inp('percent', num(base.percent), 'inputmode="decimal" required'));
        if (type === 'monthly') fields = amountF('amount', base.amount) + field(t('sv.f.day'), inp('day', num(base.day), 'type="number" min="1" max="31" required'));
        if (type === 'perIncome') fields = amountF('amount', base.amount);
        return wrap(`${sheetHead((ex ? t('common.edit') + ' · ' : '') + t('sv.type.' + type))}<form data-form="strategy" data-id="${ex ? ex.id : ''}" data-type="${type}">
          <p class="muted sm">${t('sv.hint.' + type)}</p>
          ${type !== 'percent' ? field(t('tx.currency'), sel('currency', curOpts(), base.currency)) : `<input type="hidden" name="currency" value="${esc(base.currency)}">`}
          ${fields}${field(t('sv.f.goal'), sel('goalId', goalOpts(), base.goalId || ''))}
          <div class="notice">${ic('info')}<span>${t('sv.simNote')}</span></div>
          <button class="btn primary block" type="submit">${t('common.save')}</button></form>`);
      }
      case 'reserve': {
        const r = st.savingsSettings;
        return wrap(`${sheetHead(t('sv.reserve'))}<form data-form="reserve"><p class="muted">${t('sv.reserveHint')}</p>
          <div class="two">${field(t('tx.amount'), inp('amount', num(r.reserve), 'inputmode="decimal" required'))}${field(t('tx.currency'), sel('currency', curOpts(), r.currency))}</div>
          <button class="btn primary block" type="submit">${t('common.save')}</button></form>`);
      }
      case 'lang':
        return wrap(`${sheetHead(t('prof.language'))}<div class="stack tight">${C.LANGUAGES.map(l => `<button class="row pick ${l.code === s.lang ? 'on' : ''}" data-action="set-lang" data-v="${l.code}"><span class="grow"><b>${l.name}</b></span>${l.code === s.lang ? ic('check') : ''}</button>`).join('')}</div>`);
      case 'currency':
        return wrap(`${sheetHead(t('prof.currency'))}<p class="muted sm">${t('cur.note')}</p><div class="stack tight scroll">${C.CURRENCIES.map(c => `<button class="row pick ${c.code === s.currency ? 'on' : ''}" data-action="set-currency" data-v="${c.code}"><span class="grow"><b>${c.code}</b><small>${t('curname.' + c.code)}</small></span><span class="muted">${c.symbol}</span>${c.code === s.currency ? ic('check') : ''}</button>`).join('')}</div>`);
      case 'theme':
        return wrap(`${sheetHead(t('prof.theme'))}<div class="seg wide">${['dark', 'light', 'auto'].map(m => `<button class="${s.theme === m ? 'on' : ''}" data-action="set-theme" data-v="${m}">${t('theme.' + m)}</button>`).join('')}</div>
          <h4>${t('theme.accent')}</h4><div class="swatches">${C.ACCENTS.map(a => `<button class="swatch ${s.accent === a.id ? 'on' : ''}" style="--c:${a.value}" data-action="set-accent" data-v="${a.id}" aria-label="${t('accent.' + a.id)}">${s.accent === a.id ? ic('check') : ''}</button>`).join('')}</div>`);
      case 'notifSettings':
        return wrap(`${sheetHead(t('prof.notifications'))}<div class="stack tight">${['savings', 'monthly', 'recurring', 'budget', 'unusual', 'goals'].map(k => `<div class="row static"><span class="grow"><b>${t('notif.k.' + k)}</b><small>${t('notif.d.' + k)}</small></span>
          <button class="switch ${s.notifications[k] ? 'on' : ''}" role="switch" aria-checked="${!!s.notifications[k]}" data-action="toggle-notif" data-k="${k}"><i></i></button></div>`).join('')}</div>`);
      case 'privacy':
        return wrap(`${sheetHead(t('prof.privacy'))}<div class="row static"><span class="grow"><b>${t('priv.hide')}</b><small>${t('priv.hideD')}</small></span>
          <button class="switch ${s.privacy.hideAmounts ? 'on' : ''}" role="switch" aria-checked="${!!s.privacy.hideAmounts}" data-action="toggle-hide"><i></i></button></div>
          <p class="muted sm">${ic('lock', 'sm')} ${t('priv.local')}</p>`);
      case 'notifs': {
        const list = st.notifs.map(n => {
          const p = {};
          Object.keys(n.params || {}).forEach(k => {
            const v = n.params[k];
            p[k] = v && typeof v === 'object' ? fmt(v.amt, v.cur) : (typeof v === 'string' && v[0] === '@' ? t(v.slice(1)) : v);
          });
          return `<div class="row static ${n.read ? '' : 'unread'}"><span class="tile acc">${ic('bell')}</span><span class="grow"><b>${t(n.key, p)}</b><small>${dateFmt(n.date.slice(0, 10))}</small></span></div>`;
        }).join('');
        return wrap(`${sheetHead(t('notif.title'))}<div class="stack tight scroll">${list || empty(t('notif.empty'))}</div>
          <button class="btn soft block" data-action="sheet" data-sheet="notifSettings">${t('prof.notifications')}</button>`);
      }
      case 'account':
        return wrap(`${sheetHead(t('prof.account'))}<form data-form="account">${field(t('login.name'), inp('name', st.session.name, 'required maxlength="40"'))}
          ${field(t('login.email'), inp('email', st.session.email, 'type="email" required maxlength="80"'))}<button class="btn primary block" type="submit">${t('common.save')}</button></form>`);
      case 'convert': {
        const from = d.from || s.currency, to = d.to || (s.currency === 'EUR' ? 'XAF' : 'EUR');
        const manual = C.CURRENCIES.filter(c => C.FIXED_PEGS[c.code] == null);
        const api = st.rates.api;
        return wrap(`${sheetHead(t('conv.title'))}<div id="convert-box">
          <div class="two">${field(t('tx.amount'), inp('amount', '1000', 'inputmode="decimal" data-input="convert"'))}</div>
          <div class="two">${field(t('conv.from'), sel('from', curOpts(), from, 'data-input="convert"'))}${field(t('conv.to'), sel('to', curOpts(), to, 'data-input="convert"'))}</div>
          <div class="conv-result" id="conv-result"></div></div>
          <p class="muted sm">${api ? t('conv.apiAt', { d: dateFmt(api.updatedAt.slice(0, 10)) }) : t('conv.noApi')}</p>
          <button class="btn soft block" data-action="refresh-rates">${ic('refresh')} ${t('conv.refresh')}</button>
          <h4>${t('conv.manualTitle')}</h4><p class="muted sm">${t('conv.manualHint')}</p>
          <form data-form="rate" class="two">${field(t('conv.currencyLabel'), sel('code', manual.map(c => ({ v: c.code, l: c.code })), manual[0].code))}
            ${field(t('conv.perEur'), inp('units', '', 'inputmode="decimal" placeholder="0"'))}
            <button class="btn primary block" type="submit">${t('common.save')}</button></form>
          ${Object.keys(st.rates.manual).length ? `<div class="chips">${Object.keys(st.rates.manual).map(k => `<button class="chip" data-action="clear-rate" data-v="${k}">${k}: ${st.rates.manual[k].units} ${ic('close', 'sm')}</button>`).join('')}</div>` : ''}`);
      }
      case 'confirm': {
        const k = d.kind;
        return wrap(`${sheetHead(t('confirm.title'))}<p>${t('confirm.' + k)}</p>
          <div class="form-actions"><button class="btn soft grow" data-action="close-sheet">${t('common.cancel')}</button>
          <button class="btn danger grow" data-action="confirm" data-kind="${k}" data-id="${d.id || ''}">${t('common.confirm')}</button></div>`);
      }
      default: return '';
    }
  };

  /* Résultat du convertisseur (mis à jour à la volée, sans recréer le formulaire). */
  V.convertResult = function (amount, from, to) {
    if (!(amount >= 0)) return '';
    const c = MT.currency.convert(amount, from, to);
    if (c.value == null) return `<div class="notice warn">${ic('warn')}<span>${t('conv.unavailable')}</span></div>`;
    const label = { exact: t('conv.exact'), live: t('conv.live'), estimate: t('conv.estimate') }[c.status];
    return `<b class="big">${c.status === 'exact' ? '' : '≈ '}${MT.currency.fmt(c.value, to)}</b><span class="chip ${c.status === 'estimate' ? 'warn' : 'on'}">${label}</span>`;
  };

  V.h = { esc, ic, header, card, sectionHead, seeAll, empty, bar, notice, field, inp, sel, curOpts, wrap, sheetHead, dateFmt, CAT, num, fig, fmt, catOpts, goalOpts, monthName };
})();

/* ======================== views-extra.js ======================== */
/* Vues complémentaires (budgets, récurrents, comptes, santé financière, alertes…). */
(function () {
  const MT = window.MT, V = MT.views, C = MT.CONFIG, U = MT.util;
  const t = (k, p) => MT.i18n.t(k, p);
  const S = () => MT.store.get();
  const E = () => MT.extras;
  const H = V.h;
  const { esc, ic, header, card, sectionHead, empty, field, inp, sel, curOpts, wrap, sheetHead, dateFmt, CAT, num, fmt, catOpts } = H;

  const SEV_IC = { bad: 'warn', warn: 'warn', info: 'info' };

  /* ---------- alertes de l'accueil ---------- */
  V.insights = function () {
    const items = [];
    E().budgetStatus().filter(s => s.state !== 'ok').slice(0, 2).forEach(s => items.push({
      sev: s.state === 'over' ? 'bad' : 'warn', href: '#budgets',
      text: t(s.state === 'over' ? 'in.budgetOver' : 'in.budgetNear', { c: t('cat.' + s.budget.category), p: Math.round(s.pct) }) }));
    S().goals.forEach(g => {
      if (!g.deadline) return;
      const f = E().forecast(g);
      if (f.done) return;
      if ((f.key && f.key > U.monthKey(g.deadline)) || (!f.pace && g.deadline < U.today()))
        items.push({ sev: 'warn', href: '#goal-' + g.id, text: t('in.goalBehind', { name: esc(g.name) }) });
    });
    if (!items.length) return '';
    return `<div class="insights">${items.slice(0, 3).map(i => `<a class="insight ${i.sev}" href="${i.href}">${ic(SEV_IC[i.sev])}<span>${i.text}</span>${ic('fwd', 'flip sm')}</a>`).join('')}</div>`;
  };

  /* ---------- liste de démarrage (compte vide) ---------- */
  V.checklist = function () {
    const st = S();
    if (st.demo) return '';
    const steps = [
      [st.transactions.some(x => x.type === 'income'), t('check.income'), 'data-action="sheet" data-sheet="tx" data-type="income"'],
      [st.transactions.some(x => x.type === 'expense'), t('check.expense'), 'data-action="sheet" data-sheet="tx" data-type="expense"'],
      [st.goals.length > 0, t('check.goal'), 'data-action="sheet" data-sheet="goal"'],
      [st.strategies.some(s => s.active), t('check.rule'), 'data-action="go" data-to="savings"']
    ];
    const done = steps.filter(s => s[0]).length;
    if (done === steps.length) return '';
    return card(`<div class="split"><b>${t('check.title')}</b><span class="chip on">${done}/${steps.length}</span></div>
      <div class="progress"><i style="width:${done / steps.length * 100}%"></i></div>
      ${steps.map(s => `<button class="check ${s[0] ? 'done' : ''}" ${s[2]}>${ic(s[0] ? 'check' : 'plus', 'sm')}<span>${s[1]}</span></button>`).join('')}`);
  };

  /* ---------- santé financière ---------- */
  V.health = function () {
    const h = E().health();
    if (!h) return '';
    const len = 2 * Math.PI * 34;
    return card(`<div class="health"><svg class="score-ring" viewBox="0 0 80 80" role="img" aria-label="${h.score}/100">
        <circle class="sr-bg" cx="40" cy="40" r="34"/><circle class="sr-fg" cx="40" cy="40" r="34" stroke-dasharray="${h.score / 100 * len} ${len}" transform="rotate(-90 40 40)"/>
        <text x="40" y="46" text-anchor="middle">${h.score}</text></svg>
      <div class="grow"><b>${t('health.title')}</b><span class="chip on">${t('health.' + h.label)}</span><small>${t('health.sub')}</small></div></div>
      <ul class="health-list"><li>${t('health.rate', { p: h.rate })}</li><li>${t('health.cover', { n: h.cover })}</li>

        <div class="two">${field(t('sv.f.day'), inp('day', r ? r.day : U.today().slice(8).replace(/^0/, ''), 'type="number" min="1" max="31" required'))}

/* ======================== app.js ======================== */
/* Contrôleur : routage, événements, actions. Toute modification passe par les services (finance/savings/store). */
(function () {
  const MT = window.MT, V = MT.views, C = MT.CONFIG, U = MT.util;
  const t = (k, p) => MT.i18n.t(k, p);
  const S = () => MT.store.get();
  const $ = id => document.getElementById(id);
  const LIVE = ['lang', 'currency', 'theme', 'notifSettings', 'privacy', 'notifs'];
  let sheet = null, lastKey = '', pendingRec = null;

  /* ---------- toast ---------- */
  function toast(text, kind, action) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '') + (action ? ' has-act' : '');
    el.textContent = text;
    if (action) {
      const b = document.createElement('button');
      b.className = 'toast-act'; b.textContent = action.label;
      b.onclick = () => { action.fn(); el.remove(); };
      el.appendChild(b);
    }
    $('toasts').appendChild(el);
    const life = action ? 5500 : 2600;
    setTimeout(() => el.classList.add('out'), life);
    setTimeout(() => el.remove(), life + 400);
  }

  /* ---------- thème / langue ---------- */
  function applyAppearance() {
    const s = S().settings, root = document.documentElement;
    const lang = C.LANGUAGES.find(l => l.code === s.lang) || C.LANGUAGES[0];
    const theme = s.theme === 'auto' ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : s.theme;
    root.lang = lang.code; root.dir = lang.dir; root.dataset.theme = theme;
    const acc = C.ACCENTS.find(a => a.id === s.accent) || C.ACCENTS[0];
    root.style.setProperty('--accent', acc.value);
    document.title = C.APP_NAME;
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.content = theme === 'dark' ? '#050816' : '#f3f6ff';
  }

  /* ---------- routage ---------- */
  function route() {
    const h = location.hash.replace(/^#/, '');
    if (h.startsWith('goal-')) return { name: 'goal', id: h.slice(5) };
    const known = ['home', 'wallet', 'stats', 'profile', 'savings', 'goals', 'history', 'ai', 'budgets', 'recurring'];
    return { name: known.includes(h) ? h : 'home', id: null };
  }

  function render() {
    applyAppearance();
    const st = S(), screen = $('screen'), nav = $('nav');
    if (!st.session.loggedIn) {
      screen.innerHTML = V.login(); nav.hidden = true; nav.innerHTML = ''; lastKey = 'login';
      return;
    }
    const r = route(), key = r.name + '/' + (r.id || ''), changed = key !== lastKey;
    const top = screen.scrollTop;
    screen.innerHTML = `<div class="page ${changed ? 'enter' : ''}">${V.screen(r)}</div>`;
    screen.scrollTop = changed ? 0 : top;
    nav.hidden = false; nav.innerHTML = V.nav(r);
    lastKey = key;
    if (sheet && LIVE.includes(sheet.sheet)) $('sheet-root').innerHTML = V.sheet(sheet.sheet, sheet);
  }

  /* ---------- feuilles ---------- */
  function openSheet(data) {
    sheet = data;
    const root = $('sheet-root');
    root.innerHTML = V.sheet(data.sheet, data);
    root.classList.add('open');
    if (data.sheet === 'convert') updateConvert();
    if (data.sheet === 'notifs' && MT.notify.unread()) setTimeout(() => { if (sheet && sheet.sheet === 'notifs') MT.notify.markAllRead(); }, 400);
    const af = root.querySelector('[autofocus]'); if (af) setTimeout(() => af.focus(), 60);
  }
  function closeSheet() {
    sheet = null; pendingRec = null;
    const root = $('sheet-root'); root.classList.remove('open');
    setTimeout(() => { if (!sheet) root.innerHTML = ''; }, 220);
  }

  function updateConvert() {
    const box = $('convert-box'); if (!box) return;
    const g = n => box.querySelector('[name=' + n + ']');
    $('conv-result').innerHTML = V.convertResult(MT.currency.parse(g('amount').value), g('from').value, g('to').value);
  }

  /* ---------- actions ---------- */
  const clickActions = {
    sheet: d => openSheet(d),
    'close-sheet': closeSheet,
    back: () => { if (history.length > 1) history.back(); else location.hash = '#home'; },
    'set-lang': d => { const st = S(); st.settings.lang = d.v; MT.i18n.setLang(d.v); MT.store.commit(); },
    'set-currency': d => { S().settings.currency = d.v; MT.store.commit(); toast(t('toast.currency', { c: d.v })); },
    'set-theme': d => { S().settings.theme = d.v; MT.store.commit(); },
    'set-accent': d => { S().settings.accent = d.v; MT.store.commit(); },
    'toggle-notif': d => { const n = S().settings.notifications; n[d.k] = !n[d.k]; MT.store.commit(); },
    'toggle-hide': () => { const p = S().settings.privacy; p.hideAmounts = !p.hideAmounts; MT.store.commit(); },
    'toggle-strategy': d => { MT.savings.toggle(d.id); toast(t('toast.updated')); },
    'hist-type': d => { MT.ui.hist.type = d.v; render(); },
    'set-range': d => { MT.ui.range = Number(d.v); render(); },
    'stat-month': d => {
      const cur = U.monthKey(U.today()), next = U.addMonths(MT.ui.statMonth || cur, Number(d.v));
      if (next <= cur) { MT.ui.statMonth = next; render(); }
    },
    'pick-percent': (d, el) => {
      const f = el.closest('form'); f.querySelector('[name=percent]').value = d.v;
      f.querySelectorAll('.chips .chip').forEach(c => c.classList.toggle('on', c === el));
    },
    'ai-accept': d => {
      const rec = MT.ai.analyze().recs.find(r => r.id === d.id); if (!rec) return;
      MT.ai.accept(rec); MT.ai.dismiss(rec.id); toast(t('toast.ruleCreated'), 'ok');
    },
    'ai-modify': d => {
      const rec = MT.ai.analyze().recs.find(r => r.id === d.id); if (!rec || !rec.strategy) return;
      openSheet({ sheet: 'strategy', type: rec.strategy.type, prefill: rec.strategy.params });
      pendingRec = rec.id;
    },
    'ai-dismiss': d => { MT.ai.dismiss(d.id); },
    'refresh-rates': async () => {
      const r = await MT.services.rates.fetch();
      if (r.ok) { MT.services.rates.apply(r.table); toast(t('conv.refreshed'), 'ok'); } else toast(t('conv.notConfigured'), 'warn');
    },
    'clear-rate': d => { MT.currency.setManual(d.v, 0); openSheet({ sheet: 'convert' }); },
    'export-data': () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([MT.store.exportJSON()], { type: 'application/json' }));
      a.download = 'moneytrack-' + U.today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      toast(t('toast.exported'), 'ok');
    },
    logout: async () => { await MT.services.auth.signOut(); closeSheet(); location.hash = ''; MT.store.endSession(); },
    confirm: d => {
      const F = MT.finance;
      if (d.kind === 'tx') {
        const snap = F.deleteTx(d.id); closeSheet();
        toast(t('toast.deleted'), 'ok', { label: t('common.undo'), fn: () => { F.restoreTx(snap); toast(t('toast.restored'), 'ok'); } });
        return;
      }
      else if (d.kind === 'goal') { F.deleteGoal(d.id); location.hash = '#goals'; }
      else if (d.kind === 'strategy') MT.savings.remove(d.id);
      else if (d.kind === 'clear') MT.store.clearData();
      closeSheet(); toast(t('toast.done'), 'ok');
    }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]'); if (!el) return;
    const fn = clickActions[el.dataset.action]; if (!fn) return;
    e.preventDefault();
    fn(Object.assign({}, el.dataset), el);
  });

  /* ---------- connexion en ligne : suite d'une inscription / connexion / retour Google ---------- */
  function afterOnline(r) {
    if (!r || r.ok === false || r.error) {
      if (r && r.net) return bad('login.netErr');
      if (r && r.msg === 'exists') return bad('login.exists');
      if (r && r.status === 400) return bad('login.badCreds');
      toast((r && r.msg) || t('login.netErr'), 'err'); return false;
    }
    if (r.confirm) { toast(t('login.checkMail'), 'ok'); if (MT.ui) MT.ui.loginMode = 'signin'; render(); return true; }
    const st = S(), u = r.user, email = (u.email || '').toLowerCase();
    if (st.owner && st.owner !== email) return bad('login.otherAccount');
    st.owner = email;
    MT.store.startSession(u.name || email, email, { empty: true });
    MT.finance.tick(); location.hash = '#home';
    return true;
  }

  /* ---------- formulaires ---------- */
  const P = v => MT.currency.parse(v);
  const bad = key => { toast(t(key), 'err'); return false; };

  const submits = {
    async login(f, e) {
      const kind = (e && e.submitter && e.submitter.value) || 'new', AU = MT.services.auth, st = S();
      if (kind === 'unlock') {
        if (!AU.check(f.password.value, st.auth)) return bad('login.pwWrong');
        st.session.loggedIn = true;
        MT.store.commit(); MT.finance.tick(); location.hash = '#home';
        return;
      }
      const cloud = AU.configured();
      if (kind === 'online-signin' || (kind === 'new' && cloud)) {
        if (!cloud) return bad('login.notConfigured');
        const email = f.email.value.trim(), pw = f.password.value, name = f.name ? f.name.value.trim() : '';
        if (kind === 'new') {
          if (pw.length < 6) return bad('login.pwShort');
          if (pw !== f.password2.value) return bad('login.pwMismatch');
          st.settings.currency = f.currency.value;
        }
        const btn = e.submitter; if (btn) btn.disabled = true;
        const r = kind === 'new' ? await AU.signUpEmail(email, pw, name) : await AU.signInEmail(email, pw);
        if (btn) btn.disabled = false;
        return afterOnline(r);
      }
      const name = f.name.value.trim(); // création locale (sans connexion en ligne configurée)
      if (!name) return;
      const pw = f.password.value;
      if (pw.length < 6) return bad('login.pwShort');
      if (pw !== f.password2.value) return bad('login.pwMismatch');
      st.auth = AU.makeAuth(pw);
      st.settings.currency = f.currency.value;
      await AU.signIn({ name, email: f.email.value.trim() });
      MT.store.startSession(name, f.email.value.trim(), { empty: true });
      MT.finance.tick();
      location.hash = '#home';
    },
    cloud(f) {
      const url = f.url.value.trim().replace(/\/+$/, ''), key = f.key.value.trim();
      if (url && !/^https:\/\/[^\s/]+/.test(url)) return bad('cloud.badUrl');
      S().settings.cloud = { url, key };
      MT.store.commit(); closeSheet(); toast(t('toast.saved'), 'ok');
    },
    tx(f) {
      const amount = P(f.amount.value);
      if (!(amount > 0)) return bad('err.amount');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date.value)) return bad('err.date');
      const d = { type: f.type.value, amount: MT.currency.round(amount, f.currency.value), currency: f.currency.value,
        category: f.category.value, desc: f.desc.value.trim(), date: f.date.value, accountId: f.accountId.value };
      const id = f.dataset.id;
      if (id) { MT.finance.updateTx(id, d); toast(t('toast.updated'), 'ok'); }
      else {
        const res = MT.finance.addTx(d);
        toast(t(d.type === 'income' ? 'toast.incomeAdded' : 'toast.expenseAdded'), 'ok');
        if (d.type === 'expense') { const b = MT.finance.balance(); if (!b.excluded && b.value < 0) setTimeout(() => toast(t('warn.negative'), 'warn'), 400); }
        if (res && res.count) setTimeout(() => toast(t('toast.autoSaved', { a: MT.currency.fmt(res.total, res.cur) }), 'ok'), 500);
      }
      closeSheet();
    },
    goal(f) {
      const target = P(f.target.value), initial = f.initial.value === '' ? 0 : P(f.initial.value);
      if (!f.name.value.trim()) return bad('err.name');
      if (!(target > 0)) return bad('err.amount');
      if (!(initial >= 0)) return bad('err.amount');
      if (f.deadline.value && !f.dataset.id && f.deadline.value < U.today()) return bad('err.deadline');
      const d = { name: f.name.value.trim(), target, initial, currency: f.currency.value, deadline: f.deadline.value };
      if (f.dataset.id) MT.finance.updateGoal(f.dataset.id, d); else MT.finance.addGoal(d);
      toast(t('toast.saved'), 'ok'); closeSheet();
    },
    contribute(f) {
      const amount = P(f.amount.value);
      if (!(amount > 0)) return bad('err.amount');
      const acc = S().savingsSettings.accountId;
      const r = MT.finance.contribute(f.dataset.id, amount, f.currency.value, acc);
      if (!r.ok) return bad(r.reason === 'balance' ? 'goal.insufficient' : 'conv.unavailable');
      toast(t('toast.saved'), 'ok'); closeSheet();
    },
    strategy(f) {
      const type = f.dataset.type, params = { currency: f.currency.value, goalId: f.goalId.value || null };
      const pos = n => { const v = P(f[n].value); return v > 0 ? MT.currency.round(v, params.currency) : null; };
      if (type === 'threshold') {
        params.threshold = pos('threshold'); params.amount = pos('amount');
        const rv = P(f.reserve.value);
        if (!params.threshold || !params.amount || !(rv >= 0)) return bad('err.amount');
        MT.savings.setReserve(rv, params.currency);
      } else if (type === 'percent') {
        const p = P(f.percent.value);
        if (!(p > 0 && p <= 100)) return bad('err.percent');
        params.percent = Math.round(p * 100) / 100;
      } else if (type === 'monthly') {
        params.amount = pos('amount'); params.day = parseInt(f.day.value, 10);
        if (!params.amount) return bad('err.amount');
        if (!(params.day >= 1 && params.day <= 31)) return bad('err.day');
      } else { params.amount = pos('amount'); if (!params.amount) return bad('err.amount'); }
      if (f.dataset.id) MT.savings.update(f.dataset.id, params); else MT.savings.create(type, params);
      if (pendingRec) MT.ai.dismiss(pendingRec);
      toast(t('toast.ruleCreated'), 'ok'); closeSheet();
    },
    reserve(f) {
      const v = P(f.amount.value); if (!(v >= 0)) return bad('err.amount');
      MT.savings.setReserve(v, f.currency.value); toast(t('toast.saved'), 'ok'); closeSheet();
    },
    account(f) {
      const s = S().session; s.name = f.name.value.trim() || s.name; s.email = f.email.value.trim();
      MT.store.commit(); toast(t('toast.saved'), 'ok'); closeSheet();
    },
    rate(f) {
      const u = P(f.units.value); if (!(u > 0)) return bad('err.amount');
      MT.currency.setManual(f.code.value, u); toast(t('toast.saved'), 'ok'); openSheet({ sheet: 'convert' });
    }
  };

  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    const fn = submits[f.dataset.form]; if (fn) fn(f, e);
  });

  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.input;
    if (k === 'search') { MT.ui.hist.q = e.target.value; $('hist-list').innerHTML = V.historyList(); }
    if (k === 'convert') updateConvert();
  });

  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.change;
    if (k === 'hist-cat') { MT.ui.hist.cat = e.target.value; $('hist-list').innerHTML = V.historyList(); }
    if (k === 'convert') updateConvert();
    if (k === 'txtype') {
      const f = e.target.closest('form');
      f.querySelector('[name=category]').innerHTML = V.catOptions(e.target.value);
      f.querySelectorAll('.seg label').forEach(l => l.classList.toggle('on', l.contains(e.target)));
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

  /* ---------- démarrage ---------- */
  function boot() {
    MT.store.load();
    MT.i18n.setLang(S().settings.lang);
    MT.store.subscribe(render);
    window.addEventListener('hashchange', render);
    if (S().session.loggedIn) MT.finance.tick();
    else render();
    MT.services.auth.handleRedirect().then(u => { if (u) afterOnline(u.error ? { ok: false } : { ok: true, user: u }); }, () => {});
    if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S().settings.theme === 'auto') render(); });
    // Les contributions mensuelles dues sont traitées à chaque retour dans l'application.
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S().session.loggedIn) MT.finance.tick(); });
  }
  MT.app = { clickActions, submits, openSheet, closeSheet, toast, render, bad };
  boot();
})();

/* ======================== app-extra.js ======================== */
/* Actions et formulaires des fonctions complémentaires. */
(function () {
  const MT = window.MT, A = MT.app, U = MT.util;
  const t = (k, p) => MT.i18n.t(k, p);
  const S = () => MT.store.get();
  const E = () => MT.extras;
  const P = v => MT.currency.parse(v);

  function copyText(text, okKey) {
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove(); A.toast(t(ok ? okKey : 'data.copyFail'), ok ? 'ok' : 'err');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => A.toast(t(okKey), 'ok'), fallback);
    else fallback();
  }

  const act = A.clickActions;
  act.go = d => { A.closeSheet(); location.hash = '#' + d.to; };
  act['toggle-recurring'] = d => { E().toggleRecurring(d.id); A.toast(t('toast.updated')); };
  act['copy-data'] = () => copyText(MT.store.exportJSON(), 'toast.copied');
  act['copy-summary'] = () => {
    const F = MT.finance, key = (MT.ui && MT.ui.statMonth) || U.monthKey(U.today());
    const m = F.monthTotals(key), cats = F.categoryBreakdown(key), cur = S().settings.currency;
    const f = v => MT.currency.fmt(v, cur);
    const month = new Intl.DateTimeFormat(document.documentElement.lang || 'fr', { month: 'long', year: 'numeric' }).format(new Date(key + '-01T00:00:00'));
    const lines = ['MoneyTrack Africa — ' + month, t('tx.income') + ' : ' + f(m.income), t('tx.expense') + ' : ' + f(m.expense),
      t('stats.net') + ' : ' + f(m.net), t('stats.saved') + ' : ' + f(m.saved)];
    if (cats[0]) lines.push(t('stats.topCat', { c: t('cat.' + cats[0].category) }));
    copyText(lines.join('\n'), 'toast.summaryCopied');
  };
  act['login-reset'] = (d, el) => { const b = el.closest('form').querySelector('.reset-box'); if (b) b.hidden = !b.hidden; };
  act['login-reset-do'] = () => { MT.store.resetAll(); A.toast(t('toast.done'), 'ok'); };
  act['login-mode'] = d => { MT.ui = MT.ui || {}; MT.ui.loginMode = d.v; A.render(); };
  act['login-google'] = () => {
    const AU = MT.services.auth;
    if (!AU.configured()) { A.toast(t('login.notConfigured'), 'err'); A.openSheet({ sheet: 'cloud' }); return; }
    location.href = AU.googleUrl();
  };
  act['import-data'] = () => {
    const ta = document.getElementById('import-text');
    const r = MT.store.importJSON(ta ? ta.value : '');
    if (!r.ok) return A.toast(t('data.invalid'), 'err');
    MT.i18n.setLang(S().settings.lang);
    A.closeSheet(); MT.store.commit();
    A.toast(t('data.imported'), 'ok');
  };

  const baseConfirm = act.confirm;
  act.confirm = (d, el) => {
    if (d.kind === 'acct') {
      const r = E().deleteAccount(d.id);
      A.closeSheet();
      return A.toast(r.ok ? t('toast.done') : t(r.reason === 'last' ? 'acct.lastErr' : 'acct.usedErr'), r.ok ? 'ok' : 'err');
    }
    if (d.kind === 'budget') { E().deleteBudget(d.id); A.closeSheet(); return A.toast(t('toast.done'), 'ok'); }
    if (d.kind === 'recurring') { E().deleteRecurring(d.id); A.closeSheet(); return A.toast(t('toast.done'), 'ok'); }
    baseConfirm(d, el);
  };

  document.addEventListener('change', e => {
    if (!(e.target.dataset && e.target.dataset.change === 'import-file')) return;
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { const ta = document.getElementById('import-text'); if (ta) ta.value = String(rd.result || ''); };
    rd.readAsText(file);
  });

  const sub = A.submits, bad = A.bad;
  sub.acct = f => {
    const opening = f.opening.value === '' ? 0 : P(f.opening.value);
    if (!isFinite(opening)) return bad('err.amount');
    E().saveAccount({ id: f.dataset.id, name: f.name.value.trim(), type: f.type.value, currency: f.currency.value, opening });
    A.toast(t('toast.saved'), 'ok'); A.closeSheet();
  };
  sub.budget = f => {
    const amount = P(f.amount.value);
    if (!(amount > 0)) return bad('err.amount');
    E().saveBudget({ id: f.dataset.id, category: f.category.value, amount, currency: f.currency.value });
    A.toast(t('toast.saved'), 'ok'); A.closeSheet();
  };
  sub.recurring = f => {
    const amount = P(f.amount.value), day = parseInt(f.day.value, 10);
    if (!(amount > 0)) return bad('err.amount');
    if (!(day >= 1 && day <= 31)) return bad('err.day');
    E().saveRecurring({ id: f.dataset.id, type: f.type.value, amount: MT.currency.round(amount, f.currency.value), currency: f.currency.value,
      category: f.category.value, desc: f.desc.value.trim(), day, accountId: f.accountId.value });
    A.toast(t('toast.saved'), 'ok'); A.closeSheet();
  };
  sub.withdraw = f => {
    const amount = P(f.amount.value);
    if (!(amount > 0)) return bad('err.amount');
    const r = E().withdraw(f.dataset.id, amount, f.currency.value);
    if (!r.ok) return bad(r.reason === 'exceeds' ? 'goal.withdrawExceeds' : 'conv.unavailable');
    A.toast(t('toast.saved'), 'ok'); A.closeSheet();
  };
})();

</script>
</body>
