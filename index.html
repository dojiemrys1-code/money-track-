<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>MoneyTrack Africa</title>
<style>
/* MoneyTrack Africa — thème noir / bleu nuit / bleu électrique. Propriétés logiques => RTL (arabe) natif. */
:root {
  --accent: #2f6bff;
  --bg: #050816; --bg2: #0a1030; --surface: #0d1536; --surface2: #141d47; --border: rgba(122, 152, 255, .16);
  --text: #eaf0ff; --muted: #8e9cc7; --income: #2dd4a0; --expense: #ff6b81; --warn: #f5a524;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35); --radius: 18px;
  --hero: linear-gradient(135deg, #0b1a5c 0%, #1a3fd1 55%, #2f6bff 100%);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f6ff; --bg2: #e8eeff; --surface: #ffffff; --surface2: #eef2ff; --border: rgba(20, 40, 120, .12);
  --text: #0b1230; --muted: #5a688f; --income: #0c9f74; --expense: #e0314f; --shadow: 0 8px 24px rgba(30, 50, 120, .12);
  --hero: linear-gradient(135deg, #1a3fd1 0%, #2f6bff 60%, #5b8cff 100%);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg2); color: var(--text); }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-decoration: none; }
small { font-size: 12px; color: var(--muted); display: block; }
b { font-weight: 650; }

#app { max-width: 480px; margin-inline: auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden;
  box-shadow: 0 0 0 1px var(--border); }
#screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: env(safe-area-inset-top) 16px 28px; scrollbar-width: none; }
#screen::-webkit-scrollbar { display: none; }
.page.enter { animation: pageIn .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* navigation */
#nav { display: flex; background: color-mix(in srgb, var(--surface) 92%, transparent); border-top: 1px solid var(--border); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); backdrop-filter: blur(14px); }
#nav[hidden] { display: none; }
#nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); border-radius: 12px; transition: color .2s, transform .2s; }
#nav a.on { color: var(--accent); }
#nav a:active { transform: scale(.94); }
#nav a.on .ic { transform: translateY(-1px) scale(1.08); }

/* icônes */
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; transition: transform .2s; }
.ic.sm { width: 15px; height: 15px; vertical-align: -2px; }
[dir="rtl"] .ic.flip { transform: scaleX(-1); }

/* en-têtes */
.top { display: flex; align-items: center; gap: 8px; padding: 16px 0 12px; }
.top h1 { font-size: 22px; flex: 1; letter-spacing: -.02em; }
.top-right { display: flex; gap: 8px; }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); transition: transform .15s, background .2s; }
.icon-btn:active { transform: scale(.92); }
.icon-btn.ghost { background: transparent; border-color: transparent; color: inherit; width: 32px; height: 32px; margin-inline-start: auto; }
.icon-btn.accent { background: var(--accent); color: #fff; border-color: transparent; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.badge { position: absolute; top: -4px; inset-inline-end: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--expense); color: #fff; font: 700 11px/18px system-ui; text-align: center; padding: 0 4px; }

/* cartes */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.card.list { padding: 4px 8px; gap: 0; }
.hero { background: var(--hero); color: #fff; border-radius: 24px; padding: 20px; margin-bottom: 14px; box-shadow: 0 14px 36px rgba(47, 107, 255, .35); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset-inline-end: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255, 255, 255, .09); }
.hero small { color: rgba(255, 255, 255, .75); }
.hero-top { display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: .92; }
.code { background: rgba(255, 255, 255, .18); border-radius: 8px; padding: 1px 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.hero-amt { font-size: 32px; font-weight: 750; letter-spacing: -.03em; margin: 8px 0 14px; word-break: break-word; }
.hero-row { display: flex; gap: 12px; }
.hero-row > div { flex: 1; background: rgba(255, 255, 255, .12); border-radius: 14px; padding: 10px 12px; }
.hero-row b { display: block; font-size: 15px; margin-top: 2px; }
.hero .pos, .hero .neg { color: #fff; }
.pos { color: var(--income); } .neg { color: var(--expense); } .accent-t { color: var(--accent); }
.muted { color: var(--muted); } .sm { font-size: 12.5px; } .center { text-align: center; }
.big { font-size: 22px; font-weight: 750; letter-spacing: -.02em; display: block; }
.grow { flex: 1; min-width: 0; }
.split { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.split3, .grid2 { display: grid; gap: 12px; }
.split3 { grid-template-columns: repeat(3, 1fr); text-align: center; }
.grid2 { grid-template-columns: 1fr 1fr; }
.grid2 b, .split3 b { display: block; font-size: 15px; } .grid2 em { font-style: normal; font-size: 12px; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; margin-bottom: 14px; }
.two > .field { margin-bottom: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.tight { gap: 6px; } .stack.scroll { max-height: 55vh; overflow-y: auto; }
.stack .card { margin-bottom: 0; }

.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; }
.sec-head h2 { font-size: 16px; }
.card .sec-head { margin: 0; }
.link { color: var(--accent); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }

/* boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 14px; font-weight: 650; border: 1px solid transparent; transition: transform .15s, filter .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent); }
.btn.soft { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--text); border-color: var(--border); }
.btn.danger { background: color-mix(in srgb, var(--expense) 14%, var(--surface)); color: var(--expense); border-color: color-mix(in srgb, var(--expense) 30%, transparent); }
.btn.block { width: 100%; margin-bottom: 14px; }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 11px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 650; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
.chip.on { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); border-color: transparent; }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

/* accès rapide */
.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.quick { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 600; transition: transform .15s, border-color .2s; }
.quick:active { transform: scale(.95); } .quick .ic { color: var(--accent); }
.quick.income .ic { color: var(--income); } .quick.expense .ic { color: var(--expense); }

/* lignes */
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 6px; text-align: start; border-radius: 12px; }
button.row:active { background: var(--surface2); }
.row + .row { border-top: 1px solid var(--border); }
.row.static { cursor: default; } .row.dim { opacity: .65; } .row.flat { padding: 0; border: 0; } .row.unread b { color: var(--accent); }
.row.pick { background: var(--surface); border: 1px solid var(--border); padding: 12px; } .row.pick.on { border-color: var(--accent); }
.row b { display: block; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--surface2); }
.tile.income { background: color-mix(in srgb, var(--income) 16%, transparent); color: var(--income); }
.tile.expense { background: color-mix(in srgb, var(--expense) 14%, transparent); color: var(--expense); }
.tile.acc { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.amt { text-align: end; font-weight: 700; font-size: 14px; white-space: nowrap; }
.amt small { font-weight: 500; } .amt.income { color: var(--income); } .amt.expense { color: var(--expense); }
.warn-t { color: var(--warn); }
.group-label { padding: 10px 6px 4px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: capitalize; }

/* avis */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; margin-bottom: 14px; font-size: 13px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid var(--border); }
.notice.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.notice .ic { color: var(--accent); margin-top: 1px; } .notice.warn .ic { color: var(--warn); }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }

/* objectifs */
.hscroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.goal-card { display: flex; flex-direction: column; gap: 8px; min-width: 220px; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.stack .goal-card { min-width: 0; }
.goal-foot { display: flex; justify-content: space-between; font-size: 12px; } .goal-foot em { font-style: normal; font-weight: 700; color: var(--accent); }
.progress { height: 8px; border-radius: 6px; background: var(--surface2); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), #12b5e5); transform-origin: left; animation: fill .8s cubic-bezier(.2, .8, .2, 1); }
[dir="rtl"] .progress i { transform-origin: right; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.ring-pct { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; font-weight: 800; background: var(--surface2); border: 6px solid var(--accent); }

/* formulaires */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 12.5px; font-weight: 650; color: var(--muted); }
input, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
[dir="rtl"] select { background-position: 18px 50%, 13px 50%; }
.search { margin-bottom: 10px; }
.filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
div.seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 14px; }
div.seg.wide { width: 100%; } .filters div.seg { margin: 0; }
div.seg > button, div.seg > label { flex: 1; text-align: center; padding: 9px 8px; border-radius: 10px; font-weight: 650; font-size: 13.5px; color: var(--muted); cursor: pointer; transition: background .2s, color .2s; }
div.seg > .on { background: var(--accent); color: #fff; }
div.seg input { display: none; }
.form-actions { display: flex; gap: 10px; margin-top: 6px; }
.switch { width: 48px; height: 28px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--border); position: relative; flex: none; transition: background .2s; }
.switch i { position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: inset-inline-start .2s; }
.switch.on { background: var(--accent); } .switch.on i { inset-inline-start: 25px; }
.swatches { display: flex; gap: 12px; margin-top: 10px; }
.swatch { width: 42px; height: 42px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; border: 3px solid transparent; }
.swatch.on { border-color: var(--text); }
h4 { margin: 14px 0 6px; font-size: 14px; }

/* épargne / IA */
.strat { gap: 10px; } .strat.paused { opacity: .7; }
.strat-top { display: flex; align-items: center; gap: 12px; }
.strat-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.add-strat { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: start; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); transition: transform .15s; }
.add-strat:active { transform: scale(.97); } .add-strat .ic { color: var(--accent); } .add-strat b { font-size: 13.5px; } .add-strat small { font-size: 11.5px; }
.rec { gap: 8px; border-inline-start: 4px solid var(--accent); }
.rec.anomaly { border-inline-start-color: var(--warn); } .rec.deficit { border-inline-start-color: var(--expense); }

/* statistiques */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; } .month-nav b { text-transform: capitalize; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--border); stroke-width: 1; } .chart .axis { fill: var(--muted); font-size: 9px; }
.chart .bar.inc { fill: var(--income); } .chart .bar.exp { fill: var(--expense); }
.chart .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--d, 0ms); }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; } .chart .area { fill: color-mix(in srgb, var(--accent) 18%, transparent); }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); } .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-inline-end: 6px; }
.legend .dot.inc { background: var(--income); } .legend .dot.exp { background: var(--expense); }
.donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.donut { width: 190px; height: 190px; }
.donut .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 14; }
.donut .seg { fill: none; stroke-width: 14; animation: fade .8s both; animation-delay: var(--d, 0ms); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.donut .d-top { fill: var(--text); font-size: 9px; font-weight: 700; } .donut .d-bot { fill: var(--muted); font-size: 7px; }
.cat-list { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.cat-list li { display: flex; align-items: center; gap: 10px; font-size: 13.5px; } .cat-list li i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.cat-list li span { flex: 1; } .cat-list li small { min-width: 80px; text-align: end; }
.table-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
th { text-align: start; color: var(--muted); font-weight: 600; padding: 6px 8px; } td { padding: 8px; border-top: 1px solid var(--border); text-transform: capitalize; }

/* profil */
.profile-top { display: flex; align-items: center; gap: 14px; }
.avatar { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff; background: var(--hero); }

/* connexion */
.login { padding: 8vh 0 24px; display: flex; flex-direction: column; gap: 20px; }
.brand { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.brand h1 { font-size: 30px; letter-spacing: -.03em; } .brand em { font-style: normal; color: var(--accent); } .brand p { color: var(--muted); }
.logo { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; background: var(--hero); color: #fff; box-shadow: 0 14px 34px rgba(47, 107, 255, .45); }
.logo .ic { width: 36px; height: 36px; }
.login-lang { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.conv-result { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px; border-radius: 14px; background: var(--surface2); margin-bottom: 12px; min-height: 58px; }
.conv-result .notice { margin: 0; width: 100%; }

/* feuilles et toasts */
#sheet-root { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(2, 5, 20, .6); opacity: 0; transition: opacity .25s; backdrop-filter: blur(3px); }
.sheet { position: absolute; inset-inline: 0; bottom: 0; margin-inline: auto; max-width: 480px; max-height: 90%; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 26px 26px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
#sheet-root.open { pointer-events: auto; } #sheet-root.open .sheet-backdrop { opacity: 1; } #sheet-root.open .sheet { transform: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; } .sheet-head h3 { font-size: 18px; }
#toasts { position: fixed; inset-inline: 0; top: calc(12px + env(safe-area-inset-top)); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 14px; box-shadow: var(--shadow); font-size: 13.5px; font-weight: 600; max-width: 90vw; animation: toastIn .25s both; }
.toast.ok { border-color: var(--income); } .toast.err { border-color: var(--expense); } .toast.warn { border-color: var(--warn); }
.toast.out { opacity: 0; transform: translateY(-8px); transition: .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.96); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 520px) { #app { margin-block: 0; } }

/* Chiffres et montants toujours lisibles de gauche à droite, même en arabe */
[dir="rtl"] .hero-amt, [dir="rtl"] .hero-row b, [dir="rtl"] .big, [dir="rtl"] .grid2 b, [dir="rtl"] .split3 b, [dir="rtl"] .amt, [dir="rtl"] .cat-list small, [dir="rtl"] .conv-result b { direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] .hero-amt, [dir="rtl"] .hero-row b, [dir="rtl"] .big, [dir="rtl"] .grid2 b { text-align: right; }
.chart { direction: ltr; }

/* ===== v1.1 : alertes, santé financière, budgets, récurrents, accessibilité ===== */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.pad { padding-inline: 2px; margin-bottom: 12px; }
.hero-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; outline: none; resize: vertical; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
input[type="file"] { padding: 9px 12px; font-size: 13px; }

.insights { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.insight { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--warn) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); transition: transform .15s; }
.insight:active { transform: scale(.98); } .insight span { flex: 1; } .insight .ic { color: var(--warn); }
.insight.bad { background: color-mix(in srgb, var(--expense) 13%, var(--surface)); border-color: color-mix(in srgb, var(--expense) 35%, transparent); } .insight.bad .ic:first-child { color: var(--expense); }

.check { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--surface2); text-align: start; font-weight: 600; font-size: 13.5px; transition: transform .15s; }
.check:active { transform: scale(.98); } .check .ic { color: var(--accent); }
.check.done { opacity: .6; text-decoration: line-through; } .check.done .ic { color: var(--income); }

.health { display: flex; align-items: center; gap: 14px; }
.score-ring { width: 84px; height: 84px; flex: none; }
.score-ring .sr-bg { fill: none; stroke: var(--surface2); stroke-width: 8; }
.score-ring .sr-fg { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; animation: fade .8s both; }
.score-ring text { fill: var(--text); font-size: 22px; font-weight: 800; }
.health .chip { margin: 4px 0; }
.health-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.health-list li::before { content: "•"; color: var(--accent); margin-inline-end: 8px; }

.budget { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); transition: transform .15s; }
.budget:active { transform: scale(.98); }
.budget .progress { margin-top: 8px; } .progress.near i { background: var(--warn); } .progress.over i { background: var(--expense); }
.pct { font-style: normal; font-weight: 800; font-size: 14px; min-width: 44px; text-align: end; } .pct.near { color: var(--warn); } .pct.over { color: var(--expense); }
.budget.over { border-color: color-mix(in srgb, var(--expense) 45%, transparent); }
.row-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-align: start; padding: 0; }

.toast.has-act { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
.toast-act { color: var(--accent); font-weight: 800; padding: 4px 8px; border-radius: 8px; }
.health .grow b { display: block; } .health .chip { margin: 6px 0 4px; }

/* ======================== store.js ======================== */
/* Persistance locale (localStorage) + notifications internes.
   Couche remplaçable : à terme, brancher Supabase via MT.services.db (voir services.js). */
(function () {
  const MT = window.MT, C = MT.CONFIG, U = MT.util;
  let state = null;
  const subs = [];

  function detectLang() {
    const n = (navigator.language || 'fr').slice(0, 2).toLowerCase();
    return C.LANGUAGES.some(l => l.code === n) ? n : 'fr';
  }

  function blank() {
    return {
      v: 1, seeded: false, demo: false,
      session: { loggedIn: false, name: '', email: '' },
      settings: {
        lang: detectLang(), currency: 'XAF', theme: 'dark', accent: 'electric',
        notifications: { savings: true, monthly: true, recurring: true, budget: true, unusual: true, goals: true },
        privacy: { hideAmounts: false },
        cloud: { url: '', key: '' }
      },
      rates: { api: null, manual: {} },
      auth: null, owner: null,
      accounts: [], transactions: [], goals: [], strategies: [], ledger: [], budgets: [], recurring: [], rkSkip: [],
      aiDismissed: [], notifs: [],
      savingsSettings: { reserve: C.DEFAULT_SAVINGS.reserve, currency: 'XAF', accountId: null }
    };
  }

  function ensureAccount(st) {
    if (!st.accounts.length) st.accounts.push({ id: 'acc_cash', type: 'cash', name: '', currency: 'XAF', opening: 0 });
    if (!st.savingsSettings.accountId || !st.accounts.some(a => a.id === st.savingsSettings.accountId))
      st.savingsSettings.accountId = st.accounts[0].id;
  }

  function load() {
    let saved = null;
    try { const raw = localStorage.getItem(C.STORAGE_KEY); if (raw) saved = JSON.parse(raw); } catch (e) { saved = null; }
    const b = blank();
    /* Anciennes versions : des données de démonstration pouvaient être enregistrées automatiquement : on repart de zéro. */
    if (saved && saved.demo) saved = { settings: saved.settings || {}, auth: saved.auth || null, owner: saved.owner || null };
    if (saved && typeof saved === 'object') {
      const defaults = blank().settings;
      state = Object.assign(b, saved);
      state.settings = Object.assign(defaults, saved.settings || {});
      state.settings.notifications = Object.assign(blank().settings.notifications, (saved.settings || {}).notifications || {});
      state.settings.privacy = Object.assign(blank().settings.privacy, (saved.settings || {}).privacy || {});
      state.settings.cloud = Object.assign(blank().settings.cloud, (saved.settings || {}).cloud || {});
      state.savingsSettings = Object.assign(blank().savingsSettings, saved.savingsSettings || {});
      state.rates = Object.assign(blank().rates, saved.rates || {});
    } else state = b;
    return state;
  }

  function save() { try { localStorage.setItem(C.STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* stockage indisponible */ } }
  function commit() { ensureAccount(state); save(); subs.forEach(f => f(state)); }

  MT.store = {
    get: () => state,
    load,
    commit,
    subscribe(fn) { subs.push(fn); },
    startSession(name, email, opts) {
      state.session = { loggedIn: true, name, email };
      state.seeded = true; state.demo = false;
      ensureAccount(state);
      commit();
    },
    endSession() { state.session.loggedIn = false; commit(); },
    clearData() {
      const keep = { session: state.session, settings: state.settings, auth: state.auth, owner: state.owner };
      const b = blank(); Object.assign(state, b, keep); state.seeded = true; state.demo = false; commit();
    },
    resetAll() {
      const keep = { settings: state.settings };
      Object.keys(state).forEach(k => delete state[k]);
      Object.assign(state, blank(), keep); commit();
    },
    exportJSON() { return JSON.stringify(state, null, 2); },
    /* Restaure une sauvegarde JSON (valide la structure, ignore les lignes invalides). */
    importJSON(text) {
      let d;
      try { d = JSON.parse(text); } catch (e) { return { ok: false, reason: 'json' }; }
      if (!d || typeof d !== 'object' || !Array.isArray(d.transactions) || !Array.isArray(d.accounts) || !d.accounts.length) return { ok: false, reason: 'format' };
      const b = blank();
      const m = Object.assign(b, d);
      m.session = state.session; m.auth = state.auth; m.owner = state.owner;
      m.settings = Object.assign(blank().settings, d.settings || {});
      m.settings.notifications = Object.assign(blank().settings.notifications, (d.settings || {}).notifications || {});
      m.settings.privacy = Object.assign(blank().settings.privacy, (d.settings || {}).privacy || {});
      m.settings.cloud = Object.assign(blank().settings.cloud, state.settings.cloud);
      m.savingsSettings = Object.assign(blank().savingsSettings, d.savingsSettings || {});
      m.rates = Object.assign(blank().rates, d.rates || {});
      ['goals', 'strategies', 'ledger', 'budgets', 'recurring', 'rkSkip', 'notifs', 'aiDismissed'].forEach(k => { if (!Array.isArray(m[k])) m[k] = []; });
      const okTx = t => t && typeof t.amount === 'number' && t.date && t.type && t.currency && t.accountId;
      const before = m.transactions.length;
      m.transactions = m.transactions.filter(okTx);
      m.seeded = true;
      state = m;
      return { ok: true, dropped: before - m.transactions.length };
    }
  };

  /* Notifications internes : on stocke clé + paramètres, traduits à l'affichage. */
  MT.notify = {
    push(kind, key, params) {
      const st = state;
      if (st.settings.notifications[kind] === false) return;
      st.notifs.unshift({ id: U.uid(), date: new Date().toISOString(), kind, key, params: params || {}, read: false });
      st.notifs = st.notifs.slice(0, 40);
    },
    unread: () => state.notifs.filter(n => !n.read).length,
    markAllRead() { state.notifs.forEach(n => (n.read = true)); commit(); }
  };
})();

/* ======================== currency.js ======================== */
/* Devises : formatage, conversion honnête (jamais de taux inventé). */
(function () {
  const MT = window.MT, C = MT.CONFIG;
  const S = () => MT.store.get();

  const get = code => C.CURRENCIES.find(c => c.code === code) || { code, symbol: code, digits: 2 };
  const locale = () => (C.LANGUAGES.find(l => l.code === S().settings.lang) || C.LANGUAGES[0]).locale;

  /* Unités de la devise pour 1 EUR. Priorité : parité fixe > API > saisie manuelle. */
  function rateOf(code) {
    if (C.FIXED_PEGS[code] != null) return { units: C.FIXED_PEGS[code], kind: 'fixed' };
    const api = S().rates.api;
    if (api && api.table && api.table[code] > 0) return { units: api.table[code], kind: 'live', updatedAt: api.updatedAt };
    const man = S().rates.manual[code];
    if (man && man.units > 0) return { units: man.units, kind: 'manual', updatedAt: man.updatedAt };
    return null;
  }

  /* status : exact | live | estimate | unavailable */
  function convert(amount, from, to) {
    if (from === to) return { value: amount, status: 'exact' };
    const a = rateOf(from), b = rateOf(to);
    if (!a || !b) return { value: null, status: 'unavailable' };
    const value = amount / a.units * b.units;
    let status = 'exact';
    if (a.kind === 'manual' || b.kind === 'manual') status = 'estimate';
    else if (a.kind === 'live' || b.kind === 'live') status = 'live';
    return { value, status };
  }

  function digits(code) { return get(code).digits; }

  function fmt(amount, code) {
    if (S().settings.privacy.hideAmounts) return '•••• ' + get(code).symbol;
    const d = digits(code);
    const n = new Intl.NumberFormat(locale(), { minimumFractionDigits: 0, maximumFractionDigits: d }).format(amount || 0);
    return n + ' ' + get(code).symbol;
  }

  /* Montant d'une opération exprimé dans la devise d'affichage (si possible). */
  function show(amount, cur) {
    const disp = S().settings.currency;
    if (cur === disp) return { text: fmt(amount, disp), sub: '', ok: true, status: 'exact' };
    const c = convert(amount, cur, disp);
    if (c.value == null) return { text: fmt(amount, cur), sub: '', ok: false, status: 'unavailable' };
    const approx = c.status === 'exact' ? '' : '≈ ';
    return { text: approx + fmt(c.value, disp), sub: fmt(amount, cur), ok: true, status: c.status };
  }

  function setManual(code, units) {
    if (C.FIXED_PEGS[code] != null) return false;
    if (!(units > 0)) { delete S().rates.manual[code]; } else S().rates.manual[code] = { units, updatedAt: new Date().toISOString() };
    MT.store.commit(); return true;
  }

  MT.currency = { get, digits, fmt, convert, show, rateOf, setManual,
    list: () => C.CURRENCIES,
    parse(str) {
      const n = Number(String(str == null ? '' : str).replace(/[\s ]/g, '').replace(',', '.'));
      return isFinite(n) ? n : NaN;
    },
    round(v, code) { const m = Math.pow(10, digits(code)); return Math.round(v * m) / m; }
  };
})();

/* ======================== finance.js ======================== */
/* Calculs financiers. Les montants enregistrés ne sont JAMAIS modifiés par un changement de devise d'affichage :
   chaque opération garde sa devise réelle, la conversion n'est faite qu'à l'affichage. */
(function () {
  const MT = window.MT, U = MT.util;
  const S = () => MT.store.get();
  const disp = () => S().settings.currency;
  const F = (MT.finance = {});

  function sum(items, to) {
    to = to || disp();
    let total = 0, excluded = 0, estimated = false;
    items.forEach(it => {
      const c = MT.currency.convert(it.amount, it.currency, to);
      if (c.value == null) excluded++;
      else { total += c.value; if (c.status !== 'exact') estimated = true; }
    });
    return { total, excluded, estimated };
  }
  F.sum = sum;

  F.txByMonth = (key, type) => S().transactions.filter(t => U.monthKey(t.date) === key && (!type || t.type === type));
  F.ledgerDone = () => S().ledger.filter(e => e.status === 'done');

  F.monthTotals = function (key, to) {
    const inc = sum(F.txByMonth(key, 'income'), to), exp = sum(F.txByMonth(key, 'expense'), to);
    const sav = sum(F.ledgerDone().filter(e => U.monthKey(e.date) === key), to);
    return { income: inc.total, expense: exp.total, saved: sav.total, net: inc.total - exp.total,
      excluded: inc.excluded + exp.excluded + sav.excluded, estimated: inc.estimated || exp.estimated || sav.estimated };
  };

  /* Solde disponible (revenus - dépenses - épargne mise de côté), global ou par compte. */
  F.balance = function (to, accId) {
    to = to || disp();
    const st = S();
    let total = 0, excluded = 0, estimated = false;
    const add = (amount, cur, sign) => {
      const c = MT.currency.convert(amount, cur, to);
      if (c.value == null) excluded++; else { total += sign * c.value; if (c.status !== 'exact') estimated = true; }
    };
    st.accounts.filter(a => !accId || a.id === accId).forEach(a => add(a.opening || 0, a.currency, 1));
    st.transactions.filter(t => !accId || t.accountId === accId).forEach(t => add(t.amount, t.currency, t.type === 'income' ? 1 : -1));
    F.ledgerDone().filter(e => !accId || e.accountId === accId).forEach(e => add(e.amount, e.currency, -1));
    return { value: total, excluded, estimated };
  };

  F.flowsThisMonth = (to) => F.monthTotals(U.monthKey(U.today()), to);

  F.savingsTotal = function (to) {
    const items = F.ledgerDone().map(e => ({ amount: e.amount, currency: e.currency }))
      .concat(S().goals.map(g => ({ amount: g.initial || 0, currency: g.currency })));
    return sum(items, to);
  };

  F.goalContribs = id => S().ledger.filter(e => e.goalId === id && e.status === 'done').sort((a, b) => b.date.localeCompare(a.date));
  F.goalSaved = function (g) {
    const s = sum(F.goalContribs(g.id).map(e => ({ amount: e.amount, currency: e.currency })), g.currency);
    return (g.initial || 0) + s.total;
  };
  F.goalPct = g => U.clamp(g.target > 0 ? F.goalSaved(g) / g.target * 100 : 0, 0, 100);

  F.series = function (n, to) {
    const cur = U.monthKey(U.today()), out = [];
    for (let i = n - 1; i >= 0; i--) {
      const key = U.addMonths(cur, -i), m = F.monthTotals(key, to);
      const end = key + '-31';
      const items = F.ledgerDone().filter(e => e.date <= end).map(e => ({ amount: e.amount, currency: e.currency }))
        .concat(S().goals.map(g => ({ amount: g.initial || 0, currency: g.currency })));
      out.push({ key, income: m.income, expense: m.expense, saved: m.saved, net: m.net, excluded: m.excluded, cumSaved: sum(items, to).total });
    }
    return out;
  };

  F.categoryBreakdown = function (key, to) {
    const map = {};
    F.txByMonth(key, 'expense').forEach(t => {
      const c = MT.currency.convert(t.amount, t.currency, to || disp());
      if (c.value != null) map[t.category] = (map[t.category] || 0) + c.value;
    });
    return Object.keys(map).map(k => ({ category: k, value: map[k] })).sort((a, b) => b.value - a.value);
  };

  F.accountName = a => (a && (a.name || MT.i18n.t('acct.' + a.type))) || '';
  F.account = id => S().accounts.find(a => a.id === id);

  /* ---- CRUD transactions ---- */
  F._create = function (d) {
    const tx = { id: U.uid(), type: d.type, amount: d.amount, currency: d.currency, category: d.category,
      desc: d.desc || '', date: d.date, accountId: d.accountId };
    if (d.rk) tx.rk = d.rk;
    if (tx.type === 'expense') { MT.ai.checkUnusual(tx); if (MT.extras) MT.extras.budgetCheck(tx); }
    S().transactions.push(tx);
    return { tx, res: MT.savings.onTransaction(tx) };
  };
  F.addTx = function (d) { const r = F._create(d); MT.store.commit(); return r.res; };
  F.updateTx = function (id, d) {
    const tx = S().transactions.find(t => t.id === id);
    if (!tx) return;
    Object.assign(tx, d);
    MT.store.commit();
  };
  /* Supprime la transaction ET les contributions d'épargne qu'elle avait déclenchées ; renvoie de quoi annuler. */
  F.deleteTx = function (id) {
    const st = S(), tx = st.transactions.find(t => t.id === id);
    if (!tx) return null;
    const led = st.ledger.filter(e => e.key && e.key.endsWith(':' + id));
    st.transactions = st.transactions.filter(t => t.id !== id);
    st.ledger = st.ledger.filter(e => led.indexOf(e) < 0);
    if (tx.rk) st.rkSkip.push(tx.rk); // une opération récurrente supprimée ne doit pas être recréée
    MT.store.commit();
    return { tx, led };
  };
  F.restoreTx = function (snap) {
    if (!snap) return;
    const st = S();
    st.transactions.push(snap.tx);
    snap.led.forEach(e => st.ledger.push(e));
    if (snap.tx.rk) st.rkSkip = st.rkSkip.filter(k => k !== snap.tx.rk);
    MT.store.commit();
  };

  /* ---- Objectifs ---- */
  F.addGoal = function (d) {
    const g = { id: U.uid(), name: d.name, target: d.target, initial: d.initial || 0, currency: d.currency, deadline: d.deadline || '', createdAt: U.today() };
    S().goals.push(g); MT.store.commit(); return g;
  };
  F.updateGoal = function (id, d) {
    const g = S().goals.find(x => x.id === id); if (!g) return;
    Object.assign(g, d); MT.store.commit();
  };
  F.deleteGoal = function (id) {
    const st = S();
    st.goals = st.goals.filter(g => g.id !== id);
    st.strategies.forEach(s => { if (s.goalId === id) s.goalId = null; });
    st.ledger.forEach(e => { if (e.goalId === id) e.goalId = null; });
    MT.store.commit();
  };
  /* Contribution manuelle (simulée) : doit rester dans le solde disponible. */
  F.contribute = function (goalId, amount, cur, accountId) {
    const st = S(), g = st.goals.find(x => x.id === goalId); if (!g) return { ok: false };
    const bal = F.balance(cur);
    if (bal.excluded) return { ok: false, reason: 'rate' };
    if (amount > bal.value) return { ok: false, reason: 'balance' };
    st.ledger.push({ id: U.uid(), date: U.today(), amount, currency: cur, strategyId: null, goalId, accountId,
      status: 'done', key: 'manual:' + U.uid(), source: 'manual' });
    const pct = F.goalPct(g);
    if (pct >= 100) MT.notify.push('goals', 'n.goalReached', { name: g.name });
    MT.store.commit();
    return { ok: true };
  };

  /* À chaque ouverture de l'app : opérations récurrentes dues, puis épargne mensuelle due. */
  F.tick = function () { if (MT.extras) MT.extras.processRecurring(); MT.savings.run(); };
})();

(function () {

      /* Protection locale par mot de passe (haché, jamais stocké en clair). Ce n'est PAS une authentification serveur :
         TODO Supabase : remplacer signIn/signOut par supabase.auth.signInWithPassword / signOut. */
      sha256(str) {
        const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
        const b = unescape(encodeURIComponent(str)), l = b.length, w = [];
        for (let i = 0; i < l; i++) w[i >> 2] |= b.charCodeAt(i) << (24 - (i % 4) * 8);
        w[l >> 2] |= 0x80 << (24 - (l % 4) * 8);
        w[(((l + 8) >> 6) << 4) + 15] = l * 8;
        let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
        const rr = (x, n) => (x >>> n) | (x << (32 - n));
        for (let i = 0; i < w.length; i += 16) {
          const m = w.slice(i, i + 16).map(v => v | 0); let [a,b2,c,d,e,f,g,hh] = h;
          for (let j = 0; j < 64; j++) {
            if (j >= 16) m[j] = (m[j-16] + (rr(m[j-15],7) ^ rr(m[j-15],18) ^ (m[j-15] >>> 3)) + m[j-7] + (rr(m[j-2],17) ^ rr(m[j-2],19) ^ (m[j-2] >>> 10))) | 0;
            const t1 = (hh + (rr(e,6) ^ rr(e,11) ^ rr(e,25)) + ((e & f) ^ (~e & g)) + K[j] + m[j]) | 0;
            const t2 = ((rr(a,2) ^ rr(a,13) ^ rr(a,22)) + ((a & b2) ^ (a & c) ^ (b2 & c))) | 0;
            hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b2; b2 = a; a = (t1 + t2) | 0;
          }
          h = [h[0]+a,h[1]+b2,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(v => v | 0);
        }
        return h.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
      },
      stretch(pw, salt) { let x = salt + ':' + pw; for (let i = 0; i < 20000; i++) x = this.sha256(x + salt); return x; },
      makeAuth(pw) {
        const salt = Array.from({ length: 16 }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, '0')).join('');
        return { salt, hash: this.stretch(pw, salt), v: 1 };
      },
      check(pw, auth) { return !!auth && this.stretch(pw, auth.salt) === auth.hash; },
      /* ---- connexion en ligne (Supabase Auth via REST : e-mail + mot de passe, Google). URL + clé "anon" publique uniquement. ---- */
      cfg() { const c = (MT.store.get().settings || {}).cloud || {}; return { url: String(c.url || '').trim().replace(/\/+$/, ''), key: String(c.key || '').trim() }; },
      configured() { const c = this.cfg(); return /^https:\/\//.test(c.url) && c.key.length > 20; },
      async _req(path, opts) {
        const c = this.cfg(); let r;
        const init = Object.assign({}, opts); init.headers = Object.assign({ apikey: c.key, 'Content-Type': 'application/json' }, (opts || {}).headers || {});
        try { r = await fetch(c.url + path, init); }
        catch (e) { return { ok: false, net: true }; }

      },
      _user(u) { const m = (u && u.user_metadata) || {}; return { email: u.email || '', name: m.name || m.full_name || (u.email || '').split('@')[0] }; },
      async signUpEmail(email, password, name) {

        if (!r.ok) return r;

        if (r.data && r.data.user && Array.isArray(r.data.user.identities) && !r.data.user.identities.length) return { ok: false, msg: 'exists' };

      /* Au retour de Google, l'adresse contient #access_token=… : on lit l'utilisateur puis on nettoie l'adresse. */

/* ======================== savings.js ======================== */
/* Moteur d'épargne (SIMULÉ : aucun transfert réel).
   Règles anti double-prélèvement :
   - chaque contribution a une clé unique (stratégie + opération ou mois) : jamais appliquée deux fois ;
   - sur un même revenu, l'épargne totale ne dépasse jamais ce revenu ;
   - la règle "par seuil" ne se déclenche pas si une règle de revenu a déjà épargné sur ce même revenu ;
   - toute contribution respecte la réserve minimale. */
(function () {
  const MT = window.MT, U = MT.util, C = MT.CONFIG;
  const S = () => MT.store.get();
  const TYPES = ['threshold', 'percent', 'monthly', 'perIncome'];

  function reserveIn(cur) {
    const r = S().savingsSettings;
    return MT.currency.convert(r.reserve, r.currency, cur).value;
  }
  function allowance(cur) {
    const b = MT.finance.balance(cur), r = reserveIn(cur);
    if (b.excluded || r == null) return null;
    return b.value - r;
  }
  function accId() { const st = S(); return st.savingsSettings.accountId || (st.accounts[0] && st.accounts[0].id); }

  function defaults(type) {
    const disp = S().settings.currency;
    let cur = 'XAF', k = 1;
    if (disp !== 'XAF') {
      const c = MT.currency.convert(1, 'XAF', disp);
      if (c.value != null) { cur = disp; k = c.value; }
    }
    const nice = v => {
      const x = v * k, step = x >= 1000 ? 100 : x >= 100 ? 10 : x >= 10 ? 1 : 0.1;
      return MT.currency.round(Math.max(step, Math.round(x / step) * step), cur);
    };
    const d = C.DEFAULT_SAVINGS;
    if (type === 'threshold') return { currency: cur, threshold: nice(d.threshold), amount: nice(d.amount), reserve: nice(d.reserve) };
    if (type === 'percent') return { currency: cur, percent: 10 };
    if (type === 'monthly') return { currency: cur, amount: nice(d.amount), day: 5 };
    return { currency: cur, amount: nice(d.amount) };
  }

  function nextStart(s) {
    const m = U.monthKey(U.today());
    const due = Math.min(s.day, U.daysInMonth(m));
    return Number(U.today().slice(8)) > due ? U.addMonths(m, 1) : m;
  }

  function tryContribute(s, amount, key, opts) {
    opts = opts || {};
    const st = S();
    if (st.ledger.some(e => e.key === key)) return { ok: false, reason: 'dup' };
    const a = allowance(s.currency);
    if (a == null) return { ok: false, reason: 'rate' };
    amount = MT.currency.round(amount, s.currency);
    if (amount <= 0) return { ok: false, reason: 'zero' };
    if (a < amount) {
      if (opts.partial && a > 0) {
        const m = Math.pow(10, MT.currency.digits(s.currency));
        amount = Math.floor(a * m) / m;
        if (amount <= 0) return { ok: false, reason: 'reserve' };
      } else return { ok: false, reason: 'reserve' };
    }
    const entry = { id: U.uid(), date: opts.date || U.today(), amount, currency: s.currency, strategyId: s.id,
      goalId: s.goalId || null, accountId: accId(), status: 'done', key, source: s.type };
    st.ledger.push(entry);
    return { ok: true, entry };
  }

  function stratName(s) { return MT.i18n.t('sv.type.' + s.type); }

  function onTransaction(tx) {
    if (tx.type !== 'income') return null;
    const st = S(), out = { total: 0, count: 0, cur: null };
    let spentTx = 0, contributed = false;
    const note = (s, e) => {
      out.total += MT.currency.convert(e.amount, e.currency, st.settings.currency).value || 0;
      out.count++; out.cur = st.settings.currency;
      MT.notify.push('savings', 'n.contrib', { a: { amt: e.amount, cur: e.currency }, s: stratName(s) });
    };
    const skip = s => MT.notify.push('savings', 'n.skipReserve', { s: stratName(s) });

    st.strategies.filter(s => s.active && (s.type === 'percent' || s.type === 'perIncome')).forEach(s => {
      let want;
      if (s.type === 'percent') {
        const inc = MT.currency.convert(tx.amount, tx.currency, s.currency).value;
        if (inc == null) return;
        want = inc * s.percent / 100;
      } else want = s.amount;
      const wantTx = MT.currency.convert(want, s.currency, tx.currency).value;
      if (wantTx == null || spentTx + wantTx > tx.amount + 1e-9) return; // ne jamais épargner plus que le revenu
      const r = tryContribute(s, want, s.id + ':' + tx.id, { partial: s.type === 'percent' });
      if (r.ok) { contributed = true; spentTx += MT.currency.convert(r.entry.amount, r.entry.currency, tx.currency).value || 0; note(s, r.entry); }
      else if (r.reason === 'reserve') skip(s);
    });

    if (!contributed) {
      st.strategies.filter(s => s.active && s.type === 'threshold').forEach(s => {
        const b = MT.finance.balance(s.currency);
        if (b.excluded || b.value < s.threshold) return;
        const r = tryContribute(s, s.amount, s.id + ':' + tx.id);
        if (r.ok) { contributed = true; note(s, r.entry); } else if (r.reason === 'reserve') skip(s);
      });
    }
    return out;
  }

  function processMonthly() {
    const st = S(), today = U.today(), curM = U.monthKey(today);
    st.strategies.filter(s => s.active && s.type === 'monthly').forEach(s => {
      let m = s.startMonth || curM, guard = 0;
      while (m <= curM && guard++ < 36) {
        const due = m + '-' + String(Math.min(s.day, U.daysInMonth(m))).padStart(2, '0');
        if (due > today) break;
        const key = s.id + ':' + m;
        if (!st.ledger.some(e => e.key === key)) {
          const r = tryContribute(s, s.amount, key, { date: due });
          if (r.ok) MT.notify.push('monthly', 'n.contribMonthly', { a: { amt: r.entry.amount, cur: r.entry.currency } });
          else {
            st.ledger.push({ id: U.uid(), date: due, amount: 0, planned: s.amount, currency: s.currency, strategyId: s.id,
              goalId: s.goalId || null, accountId: accId(), status: 'missed', key, source: 'monthly' });
            MT.notify.push('monthly', 'n.missed', { a: { amt: s.amount, cur: s.currency } });
          }
        }
        m = U.addMonths(m, 1);
      }
    });
  }

  MT.savings = {
    TYPES, defaults, allowance,
    create(type, params) {
      const s = Object.assign({ id: U.uid(), type, active: true, createdAt: U.today(), goalId: null }, params);
      if (type === 'monthly') s.startMonth = nextStart(s);
      S().strategies.push(s);
      processMonthly(); MT.store.commit(); return s;
    },
    update(id, params) {
      const s = S().strategies.find(x => x.id === id); if (!s) return;
      Object.assign(s, params);
      if (s.type === 'monthly') s.startMonth = nextStart(s);
      processMonthly(); MT.store.commit();
    },
    toggle(id) {
      const s = S().strategies.find(x => x.id === id); if (!s) return;
      s.active = !s.active;
      if (s.active && s.type === 'monthly') s.startMonth = nextStart(s); // pas de rattrapage rétroactif
      processMonthly(); MT.store.commit();
    },
    remove(id) {
      const st = S();
      st.strategies = st.strategies.filter(s => s.id !== id);
      MT.store.commit();
    },
    setReserve(amount, cur) {
      const r = S().savingsSettings; r.reserve = amount; r.currency = cur; MT.store.commit();
    },
    stats(id) {
      const l = S().ledger.filter(e => e.strategyId === id);
      return { done: l.filter(e => e.status === 'done').length, missed: l.filter(e => e.status === 'missed').length };
    },
    onTransaction, processMonthly,
    run() { processMonthly(); MT.store.commit(); }
  };
})();

/* ======================== ai.js ======================== */
/* Smart Savings AI : analyse locale et explicable. Elle PROPOSE uniquement ;
   rien n'est activé ni transféré sans action explicite de l'utilisateur. */
(function () {
  const MT = window.MT, U = MT.util;
  const S = () => MT.store.get();
  const disp = () => S().settings.currency;
  const OPTIONAL = ['food', 'transport', 'leisure', 'shopping', 'otherExpense'];

  const norm = t => (t.desc || '').trim().toLowerCase() || '#' + t.category;
  const conv = t => MT.currency.convert(t.amount, t.currency, disp()).value;
  const mean = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
  const cv = a => { const m = mean(a); if (!m) return 1; return Math.sqrt(mean(a.map(x => (x - m) * (x - m)))) / m; };

  function step(v) { return v >= 10000 ? 500 : v >= 1000 ? 50 : v >= 100 ? 5 : 1; }

  function analyze() {
    const st = S(), cur = U.monthKey(U.today());
    const past = [-3, -2, -1].map(n => U.addMonths(cur, n));
    const months = past.map(k => {
      const t = MT.finance.monthTotals(k);
      return { key: k, income: t.income, expense: t.expense };
    }).filter(m => m.income > 0 || m.expense > 0);
    if (!months.length) return { ready: false };

    const avgIncome = mean(months.map(m => m.income)), avgExpense = mean(months.map(m => m.expense));
    const pastTx = st.transactions.filter(t => past.includes(U.monthKey(t.date)) && t.type === 'expense' && conv(t) != null);

    // Dépenses récurrentes : ≤2 opérations par mois, présentes ≥2 mois, montant stable
    const groups = {};
    pastTx.forEach(t => {
      const g = (groups[norm(t)] = groups[norm(t)] || { label: norm(t), category: t.category, desc: t.desc, byMonth: {} });
      const m = U.monthKey(t.date);
      (g.byMonth[m] = g.byMonth[m] || []).push(conv(t));
    });
    const recurring = [];
    Object.keys(groups).forEach(k => {
      const g = groups[k], keys = Object.keys(g.byMonth);
      if (keys.length < 2) return;
      if (keys.some(m => g.byMonth[m].length > 2)) return;
      const sums = keys.map(m => g.byMonth[m].reduce((a, b) => a + b, 0));
      if (cv(sums) > 0.2) return;
      recurring.push({ category: g.category, desc: g.desc, amount: mean(sums), months: keys.length });
    });
    recurring.sort((a, b) => b.amount - a.amount);
    const recurringTotal = recurring.reduce((a, r) => a + r.amount, 0);

    const surplus = avgIncome - avgExpense;
    const budget = Math.max(0, avgIncome - recurringTotal);
    let suggested = surplus > 0 ? Math.min(surplus * 0.5, avgIncome * 0.2) : 0;
    const stp = step(suggested || avgIncome);
    suggested = Math.floor(suggested / stp) * stp;

    // Dépenses inhabituelles (mois en cours vs historique de la même catégorie)
    const anomalies = [];
    st.transactions.filter(t => t.type === 'expense' && U.monthKey(t.date) === cur).forEach(t => {
      const v = conv(t); if (v == null) return;
      const hist = pastTx.filter(p => p.category === t.category).map(conv);
      if (hist.length < 3) return;
      if (v > 2.5 * mean(hist) && v > 1.5 * Math.max.apply(null, hist)) anomalies.push({ tx: t, value: v, avg: mean(hist) });
    });

    // Catégorie facultative la plus lourde
    const byCat = {};
    pastTx.forEach(t => { if (OPTIONAL.includes(t.category)) byCat[t.category] = (byCat[t.category] || 0) + conv(t) / months.length; });
    const topCat = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a])[0];

    const recs = [], dismissed = st.aiDismissed;
    const has = type => st.strategies.some(s => s.type === type && s.active);
    if (suggested > 0) {
      if (!has('monthly')) recs.push({ id: 'monthly:' + cur, kind: 'monthly', amount: suggested, day: 5,
        strategy: { type: 'monthly', params: { currency: disp(), amount: suggested, day: 5 } } });
      if (!has('percent')) {
        const pct = U.clamp(Math.round(suggested / avgIncome * 100 / 5) * 5, 5, 20);
        recs.push({ id: 'percent:' + cur, kind: 'percent', pct,
          strategy: { type: 'percent', params: { currency: disp(), percent: pct } } });
      }
    } else recs.push({ id: 'deficit:' + cur, kind: 'deficit', gap: -surplus });
    if (topCat) {
      const cut = byCat[topCat] * 0.1, share = byCat[topCat] / (avgExpense || 1) * 100;
      if (share >= 15 && cut > 0) recs.push({ id: 'adjust:' + cur, kind: 'adjust', category: topCat, avg: byCat[topCat], cut: Math.floor(cut / step(cut)) * step(cut) });
    }
    anomalies.forEach(a => recs.push({ id: 'anomaly:' + a.tx.id, kind: 'anomaly', category: a.tx.category, value: a.value, avg: a.avg }));

    return { ready: true, months: months.length, avgIncome, avgExpense, recurring, recurringTotal, budget, surplus,
      suggested, anomalies, recs: recs.filter(r => !dismissed.includes(r.id)) };
  }

  MT.ai = {
    analyze,
    dismiss(id) { S().aiDismissed.push(id); MT.store.commit(); },
    /* Appelé seulement après un clic "Accepter" explicite de l'utilisateur. */
    accept(rec) {
      if (!rec || !rec.strategy) { MT.ai.dismiss(rec.id); return null; }
      const s = MT.savings.create(rec.strategy.type, rec.strategy.params);
      return s;
    },
    checkUnusual(tx) {
      if (tx.type !== 'expense') return;
      const cur = U.monthKey(tx.date);
      const hist = S().transactions.filter(t => t.type === 'expense' && t.category === tx.category && U.monthKey(t.date) < cur)
        .map(conv).filter(v => v != null);
      const v = conv(tx);
      if (hist.length >= 3 && v != null && v > 2.5 * mean(hist) && v > 1.5 * Math.max.apply(null, hist))
        MT.notify.push('unusual', 'n.unusual', { a: { amt: tx.amount, cur: tx.currency }, cat: '@cat.' + tx.category });
    }
  };
})();

/* ======================== extras.js ======================== */
/* Fonctions complémentaires : budgets, opérations récurrentes, comptes, retrait d'objectif, santé financière. */
(function () {
  const MT = window.MT, U = MT.util;
  const S = () => MT.store.get();
  const F = () => MT.finance;
  const E = (MT.extras = {});

  /* ---------- budgets par catégorie (mois en cours) ---------- */
  function monthSpent(category, key, cur) {
    const items = S().transactions.filter(t => t.type === 'expense' && t.category === category && U.monthKey(t.date) === key);
    return F().sum(items, cur);
  }
  E.budgetStatus = function (key) {
    key = key || U.monthKey(U.today());
    return S().budgets.map(b => {
      const s = monthSpent(b.category, key, b.currency);
      const pct = b.amount > 0 ? s.total / b.amount * 100 : 0;
      return { budget: b, spent: s.total, excluded: s.excluded, pct, state: pct >= 100 ? 'over' : pct >= 80 ? 'near' : 'ok' };
    }).sort((a, b) => b.pct - a.pct);
  };
  /* Appelé juste avant l'enregistrement d'une dépense : alerte quand elle fait franchir 80 % ou 100 %. */
  E.budgetCheck = function (tx) {
    const b = S().budgets.find(x => x.category === tx.category);
    if (!b || !(b.amount > 0)) return;
    const key = U.monthKey(tx.date);
    if (key !== U.monthKey(U.today())) return;
    const before = monthSpent(tx.category, key, b.currency);
    const add = MT.currency.convert(tx.amount, tx.currency, b.currency).value;
    if (before.excluded || add == null) return;
    const p0 = before.total / b.amount * 100, p1 = (before.total + add) / b.amount * 100;
    if (p0 < 100 && p1 >= 100) MT.notify.push('budget', 'n.budgetOver', { c: '@cat.' + tx.category });
    else if (p0 < 80 && p1 >= 80) MT.notify.push('budget', 'n.budgetNear', { c: '@cat.' + tx.category, p: Math.round(p1) });
  };
  E.saveBudget = function (d) {
    const st = S();
    const b = (d.id && st.budgets.find(x => x.id === d.id)) || st.budgets.find(x => x.category === d.category);
    if (b) Object.assign(b, { category: d.category, amount: d.amount, currency: d.currency });
    else st.budgets.push({ id: U.uid(), category: d.category, amount: d.amount, currency: d.currency });
    MT.store.commit();
  };
  E.deleteBudget = function (id) { S().budgets = S().budgets.filter(b => b.id !== id); MT.store.commit(); };

  /* ---------- opérations récurrentes ---------- */
  function nextStart(day) {
    const m = U.monthKey(U.today()), due = Math.min(day, U.daysInMonth(m));
    return Number(U.today().slice(8)) > due ? U.addMonths(m, 1) : m;
  }
  E.processRecurring = function () {
    const st = S(), today = U.today(), cur = U.monthKey(today);
    st.recurring.filter(r => r.active).forEach(r => {
      let m = r.startMonth || cur, guard = 0;
      while (m <= cur && guard++ < 36) {
        const due = m + '-' + String(Math.min(r.day, U.daysInMonth(m))).padStart(2, '0');
        if (due > today) break;
        const rk = r.id + ':' + m;
        if (!st.transactions.some(t => t.rk === rk) && st.rkSkip.indexOf(rk) < 0) {
          MT.finance._create({ type: r.type, amount: r.amount, currency: r.currency, category: r.category, desc: r.desc, date: due, accountId: r.accountId, rk });
          MT.notify.push('recurring', 'n.recurring', { a: { amt: r.amount, cur: r.currency }, c: r.desc || '@cat.' + r.category });
        }
        m = U.addMonths(m, 1);
      }
    });
  };
  E.saveRecurring = function (d) {
    const st = S();
    let r = d.id && st.recurring.find(x => x.id === d.id);
    const base = { type: d.type, amount: d.amount, currency: d.currency, category: d.category, desc: d.desc, day: d.day, accountId: d.accountId };
    if (r) { Object.assign(r, base); r.startMonth = nextStart(r.day); }
    else st.recurring.push(Object.assign({ id: U.uid(), active: true, startMonth: nextStart(d.day) }, base));
    E.processRecurring(); MT.store.commit();
  };
  E.toggleRecurring = function (id) {
    const r = S().recurring.find(x => x.id === id); if (!r) return;
    r.active = !r.active;
    if (r.active) r.startMonth = nextStart(r.day); // pas de rattrapage rétroactif
    E.processRecurring(); MT.store.commit();
  };
  E.deleteRecurring = function (id) { S().recurring = S().recurring.filter(r => r.id !== id); MT.store.commit(); };

  /* ---------- comptes ---------- */
  E.saveAccount = function (d) {
    const st = S();
    const a = d.id && st.accounts.find(x => x.id === d.id);
    if (a) Object.assign(a, { name: d.name, type: d.type, currency: d.currency, opening: d.opening });
    else st.accounts.push({ id: U.uid(), name: d.name, type: d.type, currency: d.currency, opening: d.opening });
    MT.store.commit();
  };
  E.deleteAccount = function (id) {
    const st = S();
    if (st.accounts.length <= 1) return { ok: false, reason: 'last' };
    const used = st.transactions.some(t => t.accountId === id) || st.ledger.some(e => e.accountId === id) || st.recurring.some(r => r.accountId === id);
    if (used) return { ok: false, reason: 'used' };
    st.accounts = st.accounts.filter(a => a.id !== id);
    if (st.savingsSettings.accountId === id) st.savingsSettings.accountId = st.accounts[0].id;
    MT.store.commit();
    return { ok: true };
  };

  /* ---------- objectifs : retrait et prévision ---------- */
  E.withdraw = function (goalId, amount, cur) {
    const st = S(), g = st.goals.find(x => x.id === goalId);
    if (!g) return { ok: false };
    const a = MT.currency.convert(amount, cur, g.currency).value;
    if (a == null) return { ok: false, reason: 'rate' };
    if (a > F().goalSaved(g) + 1e-9) return { ok: false, reason: 'exceeds' };
    st.ledger.push({ id: U.uid(), date: U.today(), amount: -amount, currency: cur, strategyId: null, goalId,
      accountId: st.savingsSettings.accountId, status: 'done', key: 'withdraw:' + U.uid(), source: 'withdraw' });
    MT.store.commit();
    return { ok: true };
  };
  E.forecast = function (g) {
    const saved = F().goalSaved(g);
    if (saved >= g.target) return { done: true };
    const cur = U.monthKey(U.today()), keys = [-2, -1, 0].map(n => U.addMonths(cur, n));
    const items = S().ledger.filter(e => e.goalId === g.id && e.status === 'done' && keys.indexOf(U.monthKey(e.date)) >= 0)
      .map(e => ({ amount: e.amount, currency: e.currency }));
    const pace = F().sum(items, g.currency).total / 3;
    if (!(pace > 0)) return { pace: 0 };
    return { pace, key: U.addMonths(cur, Math.ceil((g.target - saved) / pace)) };
  };

  /* ---------- score de santé financière (calcul local, 3 derniers mois) ---------- */
  E.health = function () {
    const cur = U.monthKey(U.today());
    const ms = [-3, -2, -1].map(n => F().monthTotals(U.addMonths(cur, n))).filter(m => m.income > 0 || m.expense > 0);
    if (!ms.length) return null;
    const avg = k => ms.reduce((a, m) => a + m[k], 0) / ms.length;
    const inc = avg('income'), exp = avg('expense');
    const rate = inc > 0 ? (inc - exp) / inc : 0;
    const cover = exp > 0 ? F().savingsTotal().total / exp : 0;
    const bs = E.budgetStatus(), okB = bs.filter(b => b.state !== 'over').length;
    const active = S().strategies.filter(s => s.active).length;
    const cl = (v, a, b) => Math.min(b, Math.max(a, v));
    const score = Math.round(cl(rate / 0.2, 0, 1) * 35 + cl(cover / 6, 0, 1) * 30 + (bs.length ? okB / bs.length * 20 : 10) + (active ? 15 : 0));
    return { score, label: score >= 75 ? 'excellent' : score >= 55 ? 'good' : score >= 35 ? 'fair' : 'low',
      rate: Math.round(rate * 100), cover: Math.round(cover * 10) / 10, okB, nB: bs.length, active };
  };
})();

/* ======================== charts.js ======================== */
/* Graphiques SVG sans dépendance. */
(function () {
  const MT = window.MT;
  const PALETTE = ['#2f6bff', '#12b5e5', '#7c5cff', '#12c4a4', '#f5a524', '#ff6b81', '#9bd53a', '#e879f9', '#94a3b8'];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const loc = () => (MT.CONFIG.LANGUAGES.find(l => l.code === MT.store.get().settings.lang) || MT.CONFIG.LANGUAGES[0]).locale;

  function monthLabel(key, opts) {
    const [y, m] = key.split('-').map(Number);
    return new Intl.DateTimeFormat(loc(), opts || { month: 'short' }).format(new Date(y, m - 1, 1));
  }
  function compact(v) {
    return new Intl.NumberFormat(loc(), { notation: 'compact', maximumFractionDigits: 1 }).format(v);
  }

  function bars(series, labels) {
    const W = 320, H = 170, top = 10, bot = 24, left = 4;
    const max = Math.max(1, ...series.flatMap(s => [s.income, s.expense]));
    const gw = (W - left) / series.length, bw = Math.min(14, gw / 3);
    const ch = H - top - bot;
    let g = '';
    [0, 0.5, 1].forEach(f => {
      const y = top + ch * (1 - f);
      g += `<line class="grid" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;
      if (f) g += `<text class="axis" x="${left}" y="${y - 3}">${compact(max * f)}</text>`;
    });
    series.forEach((s, i) => {
      const cx = left + gw * i + gw / 2;
      const hi = Math.max(0, s.income / max * ch), he = Math.max(0, s.expense / max * ch);
      g += `<rect class="bar inc" style="--d:${i * 60}ms" x="${cx - bw - 1}" y="${top + ch - hi}" width="${bw}" height="${hi}" rx="3"><title>${esc(labels.income)} ${compact(s.income)}</title></rect>`;
      g += `<rect class="bar exp" style="--d:${i * 60 + 30}ms" x="${cx + 1}" y="${top + ch - he}" width="${bw}" height="${he}" rx="3"><title>${esc(labels.expense)} ${compact(s.expense)}</title></rect>`;
      g += `<text class="axis" text-anchor="middle" x="${cx}" y="${H - 7}">${esc(monthLabel(s.key))}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(labels.income)} / ${esc(labels.expense)}">${g}</svg>`;
  }

  function line(points) {
    const W = 320, H = 150, top = 12, bot = 24, pad = 10;
    const vals = points.map(p => p.v), max = Math.max(1, ...vals), min = Math.min(0, ...vals);
    const rng = max - min || 1, ch = H - top - bot;
    const x = i => pad + (points.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (points.length - 1));
    const y = v => top + ch - (v - min) / rng * ch;
    const pts = points.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`);
    const area = `M${x(0)},${top + ch} L${pts.join(' L')} L${x(points.length - 1)},${top + ch} Z`;
    let g = `<line class="grid" x1="0" x2="${W}" y1="${top + ch}" y2="${top + ch}"/>`;
    g += `<path class="area" d="${area}"/><polyline class="ln" points="${pts.join(' ')}"/>`;
    points.forEach((p, i) => {
      g += `<circle class="dot" cx="${x(i)}" cy="${y(p.v)}" r="3.5"><title>${compact(p.v)}</title></circle>`;
      g += `<text class="axis" text-anchor="middle" x="${x(i)}" y="${H - 7}">${esc(p.label)}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
  }

  function donut(items, centerTop, centerBottom) {
    const total = items.reduce((a, i) => a + i.value, 0) || 1, r = 46, c = 2 * Math.PI * r;
    let off = 0, g = `<circle class="ring-bg" cx="60" cy="60" r="${r}"/>`;
    items.forEach((it, i) => {
      const len = it.value / total * c;
      g += `<circle class="seg" style="--d:${i * 80}ms" cx="60" cy="60" r="${r}" stroke="${PALETTE[i % PALETTE.length]}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(it.label)}</title></circle>`;
      off += len;
    });
    g += `<text class="d-top" x="60" y="58" text-anchor="middle">${esc(centerTop)}</text><text class="d-bot" x="60" y="72" text-anchor="middle">${esc(centerBottom)}</text>`;
    return `<svg class="donut" viewBox="0 0 120 120" role="img">${g}</svg>`;
  }

  MT.charts = { bars, line, donut, PALETTE, monthLabel };
})();
